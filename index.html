<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>اختبار القانون</title>
    <style>
        body { background: #0f172a; color: white; font-family: sans-serif; display: flex; justify-content: center; padding: 20px; }
        .card { background: #1e293b; width: 100%; max-width: 400px; padding: 20px; border-radius: 15px; text-align: center; box-shadow: 0 10px 20px rgba(0,0,0,0.5); }
        h1 { color: #c29d5f; font-size: 20px; }
        .btn { background: #334155; color: white; width: 100%; padding: 15px; margin: 10px 0; border: none; border-radius: 10px; cursor: pointer; text-align: right; font-size: 16px; }
        .correct { background: #10b981; }
        .wrong { background: #ef4444; }
        .tg { display: block; margin: 20px 0; padding: 10px; color: #38bdf8; text-decoration: none; border: 1px dashed #38bdf8; border-radius: 8px; font-weight: bold; }
        #next { background: #c29d5f; color: #0f172a; font-weight: bold; display: none; width: 100%; padding: 12px; border-radius: 10px; border: none; }
    </style>
</head>
<body>
    <div class="card" id="box">
        <h1>اختبار القانون الدستوري</h1>
        <p id="step" style="color:#94a3b8; font-size:12px; margin-bottom:20px;"></p>
        <h2 id="q" style="font-size:18px; margin-bottom:20px;"></h2>
        <div id="opts"></div>
        <a href="https://t.me/M5M5P" class="tg">📢 قناة التليجرام: M5M5P@</a>
        <button id="next" onclick="nextQ()">السؤال التالي ←</button>
    </div>

<script>
    const data = [
        {q: "أي المعايير التالية يعتمد على تدوين القواعد في وثيقة رسمية؟", opts: ["المعيار الموضوعي", "المعيار الشكلي", "المعيار العرفي", "المعيار الفقهي"], c: 1},
        {q: "تعتبر بريطانيا النموذج الأبرز لـ:", opts: ["الدساتير الجامدة", "الدساتير المكتوبة", "الدساتير العرفية", "الدساتير الممنوحة"], c: 2},
        {q: "ما هو الركن الذي يمثل النطاق الجغرافي لسيادة الدولة؟", opts: ["الشعب", "السلطة السياسية", "الإقليم", "الاعتراف الدولي"], c: 2}
    ];
    let cur = 0, score = 0;
    function load() {
        const item = data[cur];
        document.getElementById('q').innerText = item.q;
        document.getElementById('step').innerText = `سؤال ${cur+1} من ${data.length}`;
        const div = document.getElementById('opts'); div.innerHTML = '';
        item.opts.forEach((o, i) => {
            const b = document.createElement('button'); b.className = 'btn'; b.innerText = o;
            b.onclick = () => {
                const btns = document.querySelectorAll('.btn'); btns.forEach(x => x.disabled = true);
                if(i === item.c) { b.classList.add('correct'); score++; }
                else { b.classList.add('wrong'); btns[item.c].classList.add('correct'); }
                document.getElementById('next').style.display = 'block';
            };
            div.appendChild(b);
        });
    }
    function nextQ() {
        cur++;
        if(cur < data.length) { load(); document.getElementById('next').style.display = 'none'; }
        else { document.getElementById('box').innerHTML = `<h1>انتهى الاختبار</h1><div style="font-size:40px; margin:20px; color:#c29d5f;">${score}/${data.length}</div><a href="https://t.me/M5M5P" class="tg">انضم لقناتنا للمزيد</a><button class="btn" style="text-align:center" onclick="location.reload()">إعادة الاختبار</button>`; }
    }
    load();
</script>
</body>
</html>
