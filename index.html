<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>منصة اختبارات القانون الدستوري</title>
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@600;900&display=swap" rel="stylesheet">
    <style>
        :root { --primary: #c29d5f; --bg: #0f172a; --card: #1e293b; --text: #f1f5f9; }
        body { font-family: 'Cairo', sans-serif; background-color: var(--bg); color: var(--text); display: flex; justify-content: center; align-items: center; min-height: 100vh; margin: 0; padding: 20px; }
        .dashboard { width: 100%; max-width: 500px; background: var(--card); padding: 30px; border-radius: 20px; text-align: center; box-shadow: 0 20px 40px rgba(0,0,0,0.4); border: 1px solid rgba(255,255,255,0.05); }
        .book-title { color: var(--primary); font-size: 22px; font-weight: 900; margin-bottom: 5px; }
        .part-title { color: #e2e8f0; font-size: 18px; margin-bottom: 5px; font-weight: 700; }
        .author { color: #94a3b8; font-size: 13px; margin-bottom: 25px; }
        .menu-label { text-align: right; font-size: 14px; margin-bottom: 15px; color: #cbd5e1; border-right: 3px solid var(--primary); padding-right: 10px; }
        .parts-grid { display: grid; gap: 12px; }
        .part-card { background: #334155; padding: 18px; border-radius: 12px; text-decoration: none; color: white; display: flex; justify-content: space-between; align-items: center; transition: 0.2s; border: 1px solid transparent; }
        .part-card:hover { border-color: var(--primary); background: #475569; transform: scale(1.02); }
        .part-info { text-align: right; }
        .part-name { display: block; font-weight: bold; font-size: 15px; }
        .arrow { color: var(--primary); font-weight: bold; }
        .tg-footer { margin-top: 25px; display: block; padding: 10px; border: 1px dashed #38bdf8; color: #38bdf8; text-decoration: none; border-radius: 10px; font-size: 13px; }
    </style>
</head>
<body>

    <div class="dashboard">
        <div class="book-title">مبادئ القانون الدستوري</div>
        <div class="part-title">الباب الأول: نظرية الدولة</div>
        <div class="author">الأستاذ الدكتور حميد حنون خالد</div>
        
        <div class="menu-label">اختر الفصل الدراسي:</div>
        
        <div class="parts-grid">
            <a href="chapter1.html" class="part-card">
                <div class="part-info">
                    <span class="part-name">الفصل الأول: أصل الدولة</span>
                </div>
                <span class="arrow">←</span>
            </a>

            <a href="chapter2.html" class="part-card">
                <div class="part-info">
                    <span class="part-name">الفصل الثاني: الدولة وأركانها</span>
                </div>
                <span class="arrow">←</span>
            </a>

            <a href="chapter3.html" class="part-card">
                <div class="part-info">
                    <span class="part-name">الفصل الثالث: أنواع الدول</span>
                </div>
                <span class="arrow">←</span>
            </a>
        </div>

        <a href="https://t.me/M5M5P" target="_blank" class="tg-footer">📢 تابع قناتنا: M5M5P@</a>
    </div>

</body>
</html>
