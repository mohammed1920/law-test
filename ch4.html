<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>مصادر القواعد الدستورية - شامل</title>
    <style>
        :root { --primary: #c29d5f; --bg: #0f172a; --card: #1e293b; --text: #f1f5f9; --success: #10b981; --error: #ef4444; }
        body { font-family: sans-serif; background-color: var(--bg); color: var(--text); display: flex; justify-content: center; padding: 20px; margin: 0; }
        .card { background: var(--card); width: 100%; max-width: 500px; padding: 25px; border-radius: 15px; text-align: center; box-shadow: 0 10px 30px rgba(0,0,0,0.5); border: 1px solid rgba(255,255,255,0.05); }
        h1 { color: var(--primary); font-size: 18px; margin-bottom: 20px; border-bottom: 1px solid #334155; padding-bottom: 10px; }
        .btn { background: #334155; color: white; width: 100%; padding: 15px; margin: 8px 0; border: none; border-radius: 10px; cursor: pointer; text-align: right; font-size: 15px; transition: 0.2s; outline: none; }
        .correct { background: var(--success) !important; }
        .wrong { background: var(--error) !important; }
        #next { background: var(--primary); color: #0f172a; font-weight: bold; display: none; width: 100%; padding: 15px; border-radius: 10px; border: none; margin-top: 20px; cursor: pointer; font-size: 16px; }
        .nav-footer { display: flex; flex-direction: column; gap: 10px; margin-top: 25px; border-top: 1px solid #334155; padding-top: 15px; }
        .back-btn { background: #475569; color: white; text-decoration: none; padding: 12px; border-radius: 8px; font-size: 14px; text-align: center; font-weight: bold; }
        .tg-btn { background: #0088cc; color: white; text-decoration: none; padding: 12px; border-radius: 8px; font-size: 14px; text-align: center; font-weight: bold; }
    </style>
</head>
<body>
    <div class="card" id="box">
        <h1>مصادر القواعد الدستورية (60 سؤالاً)</h1>
        <p id="step" style="color:#94a3b8; font-size:12px; margin-bottom:15px;"></p>
        <h2 id="q" style="font-size:17px; margin-bottom:20px; line-height:1.5;"></h2>
        <div id="opts"></div>
        <button id="next" onclick="nextQ()">السؤال التالي ←</button>
        <div class="nav-footer">
            <a href="https://t.me/mohammed1920" class="tg-btn">📢 قناة التليجرام</a>
            <a href="index.html" class="back-btn">🏠 القائمة الرئيسية</a>
        </div>
    </div>

<script>
    const data = [
        // المبحث الأول: المصادر الرسمية
        {q: "تعتبر المصادر الرسمية هي المصادر التي تستمد منها القاعدة الدستورية:", opts: ["جمالها", "قوتها الإلزامية", "تاريخها", "لغتها"], c: 1},
        {q: "المصدر الرسمي الأول في الدول ذات الدساتير المكتوبة هو:", opts: ["العرف", "التشريع الدستوري (التدوين)", "الفقه", "القضاء"], c: 1},
        {q: "يقصد بالتشريع الدستوري صياغة القواعد في وثيقة صادرة عن:", opts: ["السلطة التأسيسية", "الشركات الخاصة", "النقابات", "الأفراد"], c: 0},
        {q: "التدوين الدستوري يضمن للفرد:", opts: ["الغموض", "معرفة حقوقه وحرياته بدقة وثبات", "تغيير القوانين يومياً", "إلغاء السلطة"], c: 1},
        {q: "العرف الدستوري هو المصدر الرسمي:", opts: ["الأول دائماً", "الثاني بجانب الدستور المكتوب", "غير الملزم", "الوحيد في العراق"], c: 1},
        {q: "الركن المادي للعرف يتمثل في:", opts: ["النية", "الاعتياد (التكرار المستمر والمستقر)", "الكتابة", "النشر في الجريدة"], c: 1},
        {q: "الركن المعنوي للعرف يتمثل في:", opts: ["طول الفترة", "الاعتقاد بإلزامية القاعدة ووجوب احترامها", "موافقة الفقهاء", "حفظ القاعدة في الصدور"], c: 1},
        {q: "العرف المفسر لا يستهدف إنشاء قاعدة جديدة بل:", opts: ["إلغاء نص", "إزالة الغموض عن نص قائم", "تعديل الدستور", "منع تطبيق القانون"], c: 1},
        {q: "العرف المكمل ينظم موضوعات:", opts: ["منظمة سابقاً", "أغفلها الدستور المكتوب أو سكت عنها", "تتعارض مع الدستور", "تافهة"], c: 1},
        {q: "العرف المعدل بالزيادة يضيف:", opts: ["نصاً كتابياً", "سلطة أو حكماً جديداً لم يرد في الوثيقة", "إبهاماً", "تعقيداً"], c: 1},
        {q: "العرف المعدل بالحذف يتمثل في:", opts: ["مسح النص بالحقيبة", "عدم ممارسة سلطة دستورية معينة بصفة مستمرة", "كتابة دستور جديد", "إلغاء المحاكم"], c: 1},
        {q: "الدستور العرفي يختلف عن العرف الدستوري في أنه:", opts: ["غير ملزم", "المصدر الوحيد للقواعد في الدولة (كإنجلترا)", "مكتوب", "يصدر عن البرلمان"], c: 1},
        {q: "من خصائص القاعدة العرفية أنها:", opts: ["تلقائية وتدريجية", "مفاجئة", "تصدر بمرسوم", "مؤقتة"], c: 0},
        {q: "العرف الدستوري في الدساتير الجامدة:", opts: ["يلغي النص المكتوب", "لا يجوز له مخالفة النص المكتوب صراحة", "أسمى من الدستور", "لا قيمة له"], c: 1},
        {q: "التدوين يوفر ميزة 'الوضوح' التي تفتقدها:", opts: ["القوانين العادية", "القواعد العرفية", "الأوامر العسكرية", "أحكام القضاء"], c: 1},
        {q: "بدأت حركة التدوين الدستوري بقوة بعد:", opts: ["الثورة الأمريكية والفرنسية", "الحرب العالمية الثانية", "سقوط بغداد", "اكتشاف النفط"], c: 0},
        {q: "التشريع الدستوري هو عمل:", opts: ["عفوي", "إرادي واعي وصادر عن سلطة", "ديني", "تاريخي مجهول"], c: 1},
        {q: "الركن المادي يشترط فيه 'العمومية'، أي:", opts: ["يطبقه عامة الناس", "تطبقه السلطات العامة المختصة بمواجهة بعضها", "ينشر في التلفاز", "يعرفه الصغار"], c: 1},
        {q: "الركن المادي يشترط فيه 'الثبات'، أي:", opts: ["التكرار دون انقطاع", "التكرار مرة واحدة", "الثبات الجغرافي", "ثبات الحاكم"], c: 0},
        {q: "المدة الزمنية في العرف الدستوري:", opts: ["محددة بسنة", "غير محددة وتخضع لتقدير القضاء والفقهاء", "يجب أن تكون قرناً", "يحددها الدستور"], c: 1},

        // المبحث الثاني: المصادر التفسيرية
        {q: "المصادر التفسيرية تسمى أيضاً المصادر:", opts: ["الرسمية", "غير الرسمية أو الاحتياطية", "المنشئة", "الملغاة"], c: 1},
        {q: "يقصد بالقضاء كمصدر تفسيري:", opts: ["تعيين القضاة", "مجموعة المبادئ المستخلصة من أحكام المحاكم الدستورية", "سلطة الشرطة", "تنفيذ الأحكام"], c: 1},
        {q: "دور القضاء الدستوري هو تفسير النصوص و:", opts: ["إلغاء السيادة", "الرقابة على دستورية القوانين", "تعيين الوزراء", "تعديل الضرائب"], c: 1},
        {q: "الفقه كمصدر تفسيري هو:", opts: ["رأي الجمهور", "آراء وشروح فقهاء وعلماء القانون الدستوري", "الفقه الديني", "قرارات البرلمان"], c: 1},
        {q: "يعتبر الفقه مصدراً 'كاشفاً' لأنه:", opts: ["لا يملك سلطة الإلزام المباشر", "يصدر عن الدولة", "يكتشف الذهب", "يدون الدستور"], c: 0},
        {q: "تستعين المحاكم بآراء الفقهاء لـ:", opts: ["دفع الرواتب", "الاستهداء بها في تفسير الغموض الدستوري", "إقالة الحكومة", "تغيير الحدود"], c: 1},
        {q: "قرارات المحكمة الاتحادية العليا في العراق لها حجية:", opts: ["مؤقتة", "مطلقة وملزمة للكافة", "بسيطة", "تاريخية فقط"], c: 1},
        {q: "يساهم القضاء في تطوير الدستور من خلال:", opts: ["تغيير النصوص", "التفسير المتطور الذي يلائم حاجة المجتمع", "إهمال النصوص", "السفر للخارج"], c: 1},
        {q: "القاعدة القضائية الدستورية تنشأ عند:", opts: ["كتابة عريضة", "استقرار القضاء على مبدأ معين في قضية ما", "اتفاق المحامين", "أمر الحاكم"], c: 1},
        {q: "الفقه الدستوري يمارس دوراً 'نقدياً' يهدف إلى:", opts: ["تحطيم الدولة", "توجيه المشرع والقضاء نحو الحلول الأفضل", "إلغاء الانتخابات", "زيادة التعقيد"], c: 1},
        {q: "المصادر التفسيرية تعتبر مرجعاً عند:", opts: ["وضوح النص", "غموض النص أو نقصه", "إلغاء الدستور", "تغيير العلم"], c: 1},
        {q: "الفرق بين القضاء والفقه أن القضاء يصدر عن:", opts: ["أفراد", "سلطة عامة (المحاكم)", "جامعات", "أحزاب"], c: 1},
        {q: "تعد المبادئ التي تقررها المحاكم مصدراً:", opts: ["للقواعد الدستورية العرفية", "للقواعد الدستورية القضائية", "للقانون التجاري", "للشعر"], c: 1},
        {q: "هل الفقه ملزم للقاضي في كتاب حميد حنون؟", opts: ["نعم", "لا، هو مصدر استئناسي فقط", "في بعض الأحيان", "إذا كان الفقيه مشهوراً"], c: 1},
        {q: "تفاعل المصادر الرسمية والتفسيرية يؤدي لـ:", opts: ["ضياع القانون", "وحدة النظام القانوني واكتماله", "تعدد الدساتير", "إلغاء القضاء"], c: 1},

        // أسئلة تفصيلية للفروع والمباحث (لإكمال الـ 60)
        {q: "العرف الدستوري لا ينشأ إلا إذا كان التصرف صادراً عن:", opts: ["فرد عادي", "إحدى السلطات العامة (التشريعية أو التنفيذية)", "تاجر", "سائح"], c: 1},
        {q: "إذا تعارض العرف المفسر مع النص المكتوب، فالعبرة بـ:", opts: ["العرف", "النص المكتوب", "كلاهما ملغى", "رأي الجمهور"], c: 1},
        {q: "في إنجلترا، السوابق القضائية تعتبر مصدراً:", opts: ["ثانوياً", "رسمياً وأساسياً", "تاريخياً", "غير موجود"], c: 1},
        {q: "ميزة 'الثبات' في الدستور المدون تعني:", opts: ["عدم التغيير أبداً", "صعوبة تعديله مقارنة بالقانون العادي", "بقاء الحاكم", "ثبات اللغة"], c: 1},
        {q: "المبحث الأول ركز على المصادر التي لها صفة:", opts: ["الجمال", "الإلزام القانوني المباشر", "التطوع", "الغموض"], c: 1},
        {q: "التدوين يحمي الأفراد من:", opts: ["البرد", "استبداد السلطة وتجاوزاتها", "كثرة الأسئلة", "الضرائب العادلة"], c: 1},
        {q: "العرف المعدل بالحذف يسمى أيضاً العرف:", opts: ["المسقط (المعطل)", "المكمل", "المفسر", "المنشئ"], c: 0},
        {q: "العرف المعدل بالإضافة يسمى العرف:", opts: ["المفسر", "المنشئ", "الملغي", "التاريخي"], c: 1},
        {q: "الركن المعنوي يحول 'العادة' إلى:", opts: ["عبادة", "قاعدة قانونية ملزمة (عرف)", "هواية", "سر"], c: 1},
        {q: "التشريع الدستوري يصدر في شكل:", opts: ["قصص", "مواد ونصوص قانونية مرتبة", "قصائد", "رسائل شفوية"], c: 1},
        {q: "الدستور العرفي هو مجموعة قواعد:", opts: ["مكتوبة", "غير مدونة في وثيقة رسمية واحدة", "من صنع الفقهاء فقط", "ملغاة"], c: 1},
        {q: "التدوين يعتبر أداة لـ:", opts: ["نشر الجهل", "التربية السياسية وتعريف الشعب بحقوقه", "إخفاء القوانين", "زيادة الورق"], c: 1},
        {q: "القضاء يملأ 'الفراغ الدستوري' عن طريق:", opts: ["كتابة نصوص جديدة", "استنباط أحكام من روح الدستور", "إلغاء المحاكم", "السكوت"], c: 1},
        {q: "الفقه يقوم بـ 'تأصيل' القواعد، أي:", opts: ["تلوينها", "إرجاعها إلى أصولها ونظرياتها العلمية", "إلغاؤها", "بيعها"], c: 1},
        {q: "المصدر 'الاحتياطي' يعني أنه:", opts: ["يُرجع إليه عند عدم وجود نص رسمي واضح", "دائماً يسبق النص الرسمي", "غير مهم إطلاقاً", "خاص بالجيش"], c: 0},
        {q: "العرف الدستوري هو ظاهرة:", opts: ["فردية", "اجتماعية وقانونية", "رياضية", "كيميائية"], c: 1},
        {q: "الركن المادي يتطلب 'الاستمرار'، وهو:", opts: ["تطبيق القاعدة مرة واحدة", "عدم الانقطاع في اتباع التصرف", "تغيير القاعدة", "نسيانها"], c: 1},
        {q: "هل يمكن للفقه أن يلغي نصاً دستورياً؟", opts: ["نعم", "لا، هو مصدر تفسيري فقط", "إذا وافق الشعب", "في حالات الحرب"], c: 1},
        {q: "أحكام القضاء الدستوري تمنع:", opts: ["التجارة", "تغول سلطة على أخرى (تجاوز الاختصاص)", "السفر", "القراءة"], c: 1},
        {q: "تُصنف 'المبادئ العامة للقانون' ضمن المصادر:", opts: ["الرسمية", "التفسيرية (أو القضائية)", "التاريخية", "الأجنبية"], c: 1},
        {q: "الفرق بين العرف والعادة أن العرف:", opts: ["قديم", "مقترن بالركن المعنوي (الإلزام)", "مكتوب", "سهل"], c: 1},
        {q: "التشريع الدستوري يتميز بـ 'السمو'، وهو:", opts: ["الارتفاع عن الأرض", "علوه فوق كافة القوانين الأخرى في الدولة", "صعوبة فهمه", "طول نصوصه"], c: 1},
        {q: "دراسة مصادر الدستور هي دراسة لـ:", opts: ["تاريخ الملوك", "شرعية القواعد الدستورية وكيفية نشوئها", "أسماء المدن", "الطقس"], c: 1},
        {q: "المحكمة الاتحادية في العراق تفسر الدستور بطلب من:", opts: ["الأطفال", "الجهات الرسمية أو المتضررين (حسب القانون)", "الأجانب", "لا أحد"], c: 1},
        {q: "ختاماً، المصادر الرسمية والتفسيرية تشكل معاً:", opts: ["فوضى قانونية", "الهرم القانوني للدولة", "كتاباً للتاريخ", "مجرد آراء"], c: 1}
    ];

    let cur = 0, score = 0;
    function load() {
        if(cur >= data.length) return;
        const item = data[cur];
        document.getElementById('q').innerText = item.q;
        document.getElementById('step').innerText = `سؤال ${cur+1} من ${data.length}`;
        const div = document.getElementById('opts'); div.innerHTML = '';
        item.opts.forEach((o, i) => {
            const b = document.createElement('button'); b.className = 'btn'; b.innerText = o;
            b.onclick = () => {
                const btns = document.querySelectorAll('.btn'); btns.forEach(x => x.disabled = true);
                if(i === item.c) { b.classList.add('correct'); score++; } 
                else { b.classList.add('wrong'); btns[item.c].classList.add('correct'); }
                document.getElementById('next').style.display = 'block';
            };
            div.appendChild(b);
        });
    }

    function nextQ() {
        cur++;
        if(cur < data.length) { load(); document.getElementById('next').style.display = 'none'; }
        else { document.getElementById('box').innerHTML = `<h2>اكتمل الفصل! النتيجة: ${score}/${data.length}</h2><a href="index.html" class="back-btn" style="display:block">العودة للرئيسية</a>`; }
    }
    load();
</script>
</body>
</html>
