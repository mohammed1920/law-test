<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>الفصل الأول: أصل الدولة</title>
    <style>
        :root { --primary: #c29d5f; --bg: #0f172a; --card: #1e293b; --text: #f1f5f9; --success: #10b981; --error: #ef4444; }
        body { font-family: sans-serif; background-color: var(--bg); color: var(--text); display: flex; justify-content: center; padding: 20px; }
        .card { background: var(--card); width: 100%; max-width: 500px; padding: 25px; border-radius: 15px; text-align: center; box-shadow: 0 10px 30px rgba(0,0,0,0.5); border: 1px solid rgba(255,255,255,0.05); }
        h1 { color: var(--primary); font-size: 20px; margin-bottom: 20px; }
        .btn { background: #334155; color: white; width: 100%; padding: 15px; margin: 8px 0; border: none; border-radius: 10px; cursor: pointer; text-align: right; font-size: 15px; transition: 0.2s; }
        .correct { background: var(--success); }
        .wrong { background: var(--error); }
        #next { background: var(--primary); color: #0f172a; font-weight: bold; display: none; width: 100%; padding: 15px; border-radius: 10px; border: none; margin-top: 20px; cursor: pointer; }
        .tg { display: block; margin-top: 20px; color: #38bdf8; text-decoration: none; font-size: 13px; border: 1px dashed #38bdf8; padding: 10px; border-radius: 8px; }
    </style>
</head>
<body>
    <div class="card" id="box">
        <h1>الفصل الأول: أصل الدولة</h1>
        <p id="step" style="color:#94a3b8; font-size:12px; margin-bottom:15px;"></p>
        <h2 id="q" style="font-size:17px; margin-bottom:20px; line-height:1.5;"></h2>
        <div id="opts"></div>
        <button id="next" onclick="nextQ()">السؤال التالي ←</button>
        <a href="https://t.me/M5M5P" class="tg">📢 قناة التليجرام: M5M5P@</a>
    </div>

<script>
    const data = [
        {q: "تعتمد النظرية الثيوقراطية في تفسير أصل نشأة الدولة على:", opts: ["الإرادة البشرية", "القوة العسكرية", "الإرادة الإلهية", "التطور الاقتصادي"], c: 2},
        {q: "وفقاً لنظرية (الطبيعة الإلهية للحكام)، فإن الحاكم:", opts: ["بشر اختاره الله", "إله أو جزء من الإله", "وكيل عن الأمة", "منتخب"], c: 1},
        {q: "نظرية (الحق الإلهي المباشر) تعني أن الله اختار الحكام:", opts: ["عن طريق الشعب", "مباشرة دون تدخل البشر", "عن طريق الوراثة فقط", "بالصدفة"], c: 1},
        {q: "أدت النظريات الثيوقراطية تاريخياً إلى تكريس حكم:", opts: ["الديمقراطية", "الاستبداد المطلق", "المؤسسات", "الجمهورية"], c: 1},
        {q: "نظرية (الحق الإلهي غير المباشر) تسمى أيضاً بنظرية:", opts: ["التفويض الإلهي", "العقد الاجتماعي", "القوة المادية", "التطور التاريخي"], c: 0},
        {q: "تقوم نظرية 'القوة' على فكرة أن الدولة نشأت نتيجة:", opts: ["عقد", "صراع غلب فيه القوي على الضعيف", "تطور أسري", "اتفاق ديني"], c: 1},
        {q: "يرى الفيلسوف (جريجوري السابع) أن الدولة:", opts: ["عمل إلهي", "من صنع البشر وبإيعاز من الشيطان", "ثمرة العقد الاجتماعي", "تطور طبيعي للأسرة"], c: 1},
        {q: "تعتبر نظريات 'العقد الاجتماعي' أن أصل الدولة يرجع إلى:", opts: ["القوة", "إرادة الأفراد واتفاقهم", "الوحي", "الصدفة"], c: 1},
        {q: "يرى 'توماس هوبز' أن حالة الفطرة قبل الدولة كانت:", opts: ["سلام", "حرب الجميع ضد الجميع", "ديمقراطية", "منظمة"], c: 1},
        {q: "التنازل في العقد الاجتماعي عند 'هوبز' يكون:", opts: ["جزئياً", "كلياً وشاملاً لكل الحقوق", "لصالح البرلمان", "مؤقتاً"], c: 1},
        {q: "الحاكم في نظر 'هوبز' يعتبر:", opts: ["طرفاً في العقد", "ليس طرفاً في العقد ولا يلتزم بشروطه", "وكيلاً عن الشعب", "قابلاً للعزل"], c: 1},
        {q: "الهدف الأساسي من العقد الاجتماعي عند 'هوبز' هو:", opts: ["الحرية", "الأمن والاستقرار", "المساواة", "تداول السلطة"], c: 1},
        {q: "يرى 'جون لوك' أن الأفراد في حالة الفطرة كانوا يتمتعون بـ:", opts: ["حقوق طبيعية كالحرية والملكية", "لا حقوق لهم", "حق القوة فقط", "حقوق دينية"], c: 0},
        {q: "التنازل عن الحقوق في عقد 'جون لوك' يكون:", opts: ["كلياً", "جزئياً (قدر الضرورة لحماية الحقوق)", "لصالح الحاكم فقط", "مستحيلاً"], c: 1},
        {q: "الحاكم في عقد 'جون لوك' يعتبر:", opts: ["إلهاً", "طرفاً في العقد ويلتزم بشروطه", "سلطة مطلقة", "فوق القانون"], c: 1},
        {q: "إذا خالف الحاكم شروط العقد عند 'جون لوك' يحق للشعب:", opts: ["الصبر عليه", "مقاومته وعزله", "الدعاء له", "ترك الدولة"], c: 1},
        {q: "يرى 'جان جاك روسو' أن حالة الفطرة كانت تتميز بـ:", opts: ["البؤس", "السعادة والحرية والمساواة", "الحروب الدائمة", "العبودية"], c: 1},
        {q: "التنازل في عقد 'روسو' يكون للمجتمع، وهذا يؤدي لنشوء:", opts: ["الإرادة العامة", "الحكم الديكتاتوري", "الملكية المطلقة", "الفيدرالية"], c: 0},
        {q: "السيادة عند 'روسو' تتميز بأنها:", opts: ["تقبل التنازل", "لا تقبل التجزئة ولا التنازل عنها", "ملك للحاكم", "تنتقل بالوراثة"], c: 1},
        {q: "وفقاً لـ 'روسو'، القانون هو تعبير عن:", opts: ["إرادة الحاكم", "الإرادة العامة للشعب", "القوة", "العرف"], c: 1},
        {q: "نظرية 'تطور الأسرة' تعتبر الخلية الأولى للدولة هي:", opts: ["الفرد", "الأسرة", "الجيش", "المصنع"], c: 1},
        {q: "تنتقد نظرية 'الأسرة' لأن الدولة تختلف عن الأسرة من حيث:", opts: ["العدد", "الأهداف والسلطة والإقليم", "اللغة", "الدين"], c: 1},
        {q: "النظرية 'الماركسية' ترى أن الدولة أداة في يد:", opts: ["الشعب", "الطبقة المسيطرة اقتصادياً", "الفقراء", "المثقفين"], c: 1},
        {q: "وفقاً للماركسية، الدولة ستختفي عندما:", opts: ["تقوم حرب", "تزول الفوارق الطبقية", "يتغير الحاكم", "ينتهي التاريخ"], c: 1},
        {q: "نظرية 'التطور التاريخي' ترى أن الدولة نتاج:", opts: ["عقد واحد", "تفاعل عوامل متعددة عبر التاريخ", "قرار ملكي", "قوة عسكرية فقط"], c: 1},
        {q: "يرى الفيلسوف 'أرسطو' أن الإنسان حيوان:", opts: ["قوي", "اجتماعي وسياسي بطبعه", "انعزالي", "اقتصادي"], c: 1},
        {q: "تعتبر نظرية 'العقد الاجتماعي' من النظريات:", opts: ["الدينية", "الديمقراطية", "الاستبدادية", "التقليدية"], c: 1},
        {q: "الانتقاد الرئيسي لنظريات العقد الاجتماعي هو أنها تعتمد على:", opts: ["حقائق تاريخية", "خيال وافتراض غير واقعي", "قوة السلاح", "نتائج اقتصادية"], c: 1},
        {q: "الفرق بين 'لوك' و 'هوبز' أن الأخير يدعو لـ:", opts: ["الديمقراطية", "الحكم المطلق", "الثورة", "فصل السلطات"], c: 1},
        {q: "من العوامل التي ساهمت في تطور الدولة تاريخياً حسب حميد حنون:", opts: ["الدين والقوة والعامل الاقتصادي", "التكنولوجيا فقط", "كرة القدم", "اكتشاف النفط"], c: 0}
    ];

    let cur = 0, score = 0;
    function load() {
        if(cur >= data.length) return;
        const item = data[cur];
        document.getElementById('q').innerText = item.q;
        document.getElementById('step').innerText = `سؤال ${cur+1} من ${data.length}`;
        const div = document.getElementById('opts'); div.innerHTML = '';
        item.opts.forEach((o, i) => {
            const b = document.createElement('button'); b.className = 'btn'; b.innerText = o;
            b.onclick = () => {
                const btns = document.querySelectorAll('.btn'); btns.forEach(x => x.disabled = true);
                if(i === item.c) { b.classList.add('correct'); score++; }
                else { b.classList.add('wrong'); btns[item.c].classList.add('correct'); }
                document.getElementById('next').style.display = 'block';
            };
            div.appendChild(b);
        });
    }

    function nextQ() {
        cur++;
        if(cur < data.length) { 
            load(); 
            document.getElementById('next').style.display = 'none'; 
        } else { 
            document.getElementById('box').innerHTML = `
                <h1>النتيجة النهائية (الفصل 1)</h1>
                <div style="font-size:40px; margin:20px; color:#c29d5f;">${score}/${data.length}</div>
                <button class="btn" style="text-align:center; background:#10b981" onclick="location.href='ch2.html'">انتقل للفصل الثاني ←</button>
                <button class="btn" style="text-align:center; background:#475569" onclick="location.href='index.html'">العودة للرئيسية</button>
            `; 
        }
    }
    load();
</script>
</body>
</html>
