<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>الفصل الأول: أصل الدولة</title>
    <style>
        :root { --primary: #c29d5f; --bg: #0f172a; --card: #1e293b; --text: #f1f5f9; --success: #10b981; --error: #ef4444; }
        body { font-family: sans-serif; background-color: var(--bg); color: var(--text); display: flex; justify-content: center; padding: 20px; margin: 0; }
        .card { background: var(--card); width: 100%; max-width: 500px; padding: 25px; border-radius: 15px; text-align: center; box-shadow: 0 10px 30px rgba(0,0,0,0.5); border: 1px solid rgba(255,255,255,0.05); }
        h1 { color: var(--primary); font-size: 18px; margin-bottom: 20px; border-bottom: 1px solid #334155; padding-bottom: 10px; }
        .btn { background: #334155; color: white; width: 100%; padding: 15px; margin: 8px 0; border: none; border-radius: 10px; cursor: pointer; text-align: right; font-size: 15px; transition: 0.2s; outline: none; }
        .correct { background: var(--success) !important; }
        .wrong { background: var(--error) !important; }
        #next { background: var(--primary); color: #0f172a; font-weight: bold; display: none; width: 100%; padding: 15px; border-radius: 10px; border: none; margin-top: 20px; cursor: pointer; font-size: 16px; }
        .nav-footer { display: flex; flex-direction: column; gap: 10px; margin-top: 25px; border-top: 1px solid #334155; padding-top: 15px; }
        .back-btn { background: #475569; color: white; text-decoration: none; padding: 12px; border-radius: 8px; font-size: 14px; text-align: center; font-weight: bold; }
        .tg-btn { background: #0088cc; color: white; text-decoration: none; padding: 12px; border-radius: 8px; font-size: 14px; text-align: center; font-weight: bold; }
    </style>
</head>
<body>
    <div class="card" id="box">
        <h1>الفصل الأول: أصل الدولة</h1>
        <p id="step" style="color:#94a3b8; font-size:12px; margin-bottom:15px;"></p>
        <h2 id="q" style="font-size:17px; margin-bottom:20px; line-height:1.5;"></h2>
        <div id="opts"></div>
        <button id="next" onclick="nextQ()">السؤال التالي ←</button>
        <div class="nav-footer">
            <a href="https://t.me/mohammed1920" class="tg-btn">📢 قناة التليجرام</a>
            <a href="index.html" class="back-btn">🏠 القائمة الرئيسية</a>
        </div>
    </div>

<script>
    const data = [
        {q: "وفقاً لنظرية (الطبيعة الإلهية للحكام)، يعتبر الحاكم:", opts: ["بشر اختاره الله", "وكيل عن الشعب", "إله أو جزء من الإله", "منتخب من الكنيسة"], c: 2},
        {q: "يرى 'توماس هوبز' أن العقد الاجتماعي أدى لقيام حكم:", opts: ["ديمقراطي حر", "مستبد ومطلق الصلاحيات", "برلماني مقيد", "جمهوري"], c: 1},
        {q: "تعتمد النظرية الثيوقراطية في تفسير نشأة الدولة على:", opts: ["الإرادة البشرية", "القوة المادية", "الإرادة الإلهية", "التطور الاقتصادي"], c: 2},
        {q: "في حالة الفطرة عند 'جون لوك'، كان الأفراد يتمتعون بـ:", opts: ["حقوق طبيعية كالحرية والملكية", "حق القوة فقط", "لا حقوق لهم مطلقاً", "حقوق ممنوحة من الحاكم"], c: 0},
        {q: "نظرية 'الحق الإلهي المباشر' ترى أن الله اختار الحكام:", opts: ["عن طريق الشعب", "بشكل مباشر دون تدخل البشر", "بناءً على الكفاءة", "بالوراثة فقط"], c: 1},
        {q: "العقد عند 'جان جاك روسو' يكون التنازل فيه لصالح:", opts: ["شخص الحاكم", "المجتمع (الإرادة العامة)", "الطبقة الأرستقراطية", "الجيش"], c: 1},
        {q: "تقوم نظرية 'القوة' على فكرة أن الدولة نشأت نتيجة:", opts: ["اتفاق ديني", "عقد اجتماعي", "صراع غلب فيه القوي على الضعيف", "تطور أسري"], c: 2},
        {q: "يرى 'توماس هوبز' أن أطراف العقد الاجتماعي هم:", opts: ["الحاكم والشعب", "الأفراد فيما بينهم والحاكم ليس طرفاً", "الدول المجاورة", "الأغنياء والفقراء"], c: 1},
        {q: "نظرية 'تطور الأسرة' تعتبر الدولة توسعاً لـ:", opts: ["النشاط التجاري", "القوة العسكرية", "الخلية الاجتماعية الأولى (الأسرة)", "الفكر الفلسفي"], c: 2},
        {q: "وفقاً لـ 'جون لوك'، إذا خالف الحاكم شروط العقد يحق للشعب:", opts: ["الصبر عليه", "مقاومته وعزله", "تركه والهجرة", "الدعاء له"], c: 1},
        {q: "السيادة عند 'روسو' تتميز بأنها:", opts: ["تقبل التجزئة", "ملك للحاكم", "لا تقبل التجزئة ولا التنازل عنها", "مؤقتة"], c: 2},
        {q: "النظرية 'الماركسية' ترى الدولة أداة في يد:", opts: ["الطبقة المسيطرة اقتصادياً", "عامة الشعب", "المثقفين", "رجال الدين"], c: 0},
        {q: "يرى الفيلسوف (جريجوري السابع) أن الدولة من صنع البشر بـ:", opts: ["إيعاز من الشيطان", "أمر من الله", "اتفاق تجاري", "قوة السلاح"], c: 0},
        {q: "العقد عند 'جون لوك' يكون بين:", opts: ["الأفراد فقط", "الحكام وحدهم", "الأفراد والحاكم طرف فيه", "الأمة والدول الأخرى"], c: 2},
        {q: "تؤدي نظرية 'سيادة الشعب' عند روسو إلى نظام:", opts: ["الاقتراع المقيد", "الاقتراع العام", "التعيين", "الوراثة"], c: 1},
        {q: "انتقدت نظرية 'العقد الاجتماعي' لأنها تعتمد على:", opts: ["حقائق تاريخية", "خيال وافتراض غير واقعي", "إحصائيات سكانية", "قوة القانون الدولي"], c: 1},
        {q: "الهدف من العقد عند 'هوبز' هو:", opts: ["الحرية", "المساواة", "الأمن والاستقرار", "تداول السلطة"], c: 2},
        {q: "نظرية 'التطور التاريخي' تفسر الدولة بأنها نتاج:", opts: ["عقد واحد", "قرار مفاجئ", "تفاعل عوامل متعددة عبر التاريخ", "منحة إلهية"], c: 2},
        {q: "الحاكم في نظر 'هوبز' يعتبر:", opts: ["مقيداً بالعقد", "وكيلاً عن الشعب", "ليس طرفاً في العقد ولا يلتزم به", "قابلاً للمحاسبة"], c: 2},
        {q: "يرى 'روسو' أن القانون هو تعبير عن:", opts: ["إرادة الحاكم", "الإرادة العامة للشعب", "العرف القديم", "القوة"], c: 1},
        {q: "نظرية 'التفويض الإلهي' هي اسم آخر لنظرية:", opts: ["الحق الإلهي غير المباشر", "العقد الاجتماعي", "القوة", "التطور الاجتماعي"], c: 0},
        {q: "يرى 'لوك' أن التنازل عن الحقوق في العقد يكون:", opts: ["كلياً", "جزئياً بقدر الضرورة", "مستحيلاً", "لصالح الكنيسة"], c: 1},
        {q: "أدت النظريات الثيوقراطية تاريخياً إلى تكريس:", opts: ["الديمقراطية", "الاستبداد المطلق", "المواطنة", "فصل السلطات"], c: 1},
        {q: "يرى 'أرسطو' أن الإنسان حيوان:", opts: ["اقتصادي", "انعزالي", "اجتماعي وسياسي بطبعه", "عسكري"], c: 2},
        {q: "النظرية التي تخلط بين القوة المادية والحق القانوني هي:", opts: ["الثيوقراطية", "القوة", "العقدية", "التاريخية"], c: 1},
        {q: "حالة الفطرة عند 'هوبز' كانت تتميز بـ:", opts: ["السلام", "حرب الجميع ضد الجميع", "المساواة المثالية", "التنظيم القانوني"], c: 1},
        {q: "يعد 'جون لوك' المنظر الأول لفكرة:", opts: ["الحكم المطلق", "النظام الديمقراطي الليبرالي", "الماركسية", "الفاشية"], c: 1},
        {q: "العقد الاجتماعي هو اتفاق يفترض وقوعه في:", opts: ["المستقبل", "الماضي السحيق (افتراضاً)", "الحاضر", "العصور الوسطى"], c: 1},
        {q: "تختفي الدولة عند الماركسية عند:", opts: ["قيام الحرب", "زوال الفوارق الطبقية", "تغير الدستور", "زيادة الثروة"], c: 1},
        {q: "من عوامل تطور الدولة حسب حميد حنون:", opts: ["الدين والقوة والاقتصاد", "الصدفة فقط", "اللغة الواحدة", "المناخ المعتدل"], c: 0}
    ];

    let cur = 0, score = 0;
    function load() {
        if(cur >= data.length) return;
        const item = data[cur];
        document.getElementById('q').innerText = item.q;
        document.getElementById('step').innerText = `سؤال ${cur+1} من ${data.length}`;
        const div = document.getElementById('opts'); div.innerHTML = '';
        item.opts.forEach((o, i) => {
            const b = document.createElement('button'); b.className = 'btn'; b.innerText = o;
            b.onclick = () => {
                const btns = document.querySelectorAll('.btn'); btns.forEach(x => x.disabled = true);
                if(i === item.c) { b.classList.add('correct'); score++; } 
                else { b.classList.add('wrong'); btns[item.c].classList.add('correct'); }
                document.getElementById('next').style.display = 'block';
            };
            div.appendChild(b);
        });
    }

    function nextQ() {
        cur++;
        if(cur < data.length) { load(); document.getElementById('next').style.display = 'none'; }
        else { document.getElementById('box').innerHTML = `<h2>اكتمل الفصل الأول! النتيجة: ${score}/${data.length}</h2><a href="index.html" class="back-btn" style="display:block">العودة للرئيسية</a>`; }
    }
    load();
</script>
</body>
</html>
