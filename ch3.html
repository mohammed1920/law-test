<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>الفصل الثالث: أنواع الدول</title>
    <style>
        :root { --primary: #c29d5f; --bg: #0f172a; --card: #1e293b; --text: #f1f5f9; --success: #10b981; --error: #ef4444; }
        body { font-family: sans-serif; background-color: var(--bg); color: var(--text); display: flex; justify-content: center; padding: 20px; margin: 0; }
        .card { background: var(--card); width: 100%; max-width: 500px; padding: 25px; border-radius: 15px; text-align: center; box-shadow: 0 10px 30px rgba(0,0,0,0.5); border: 1px solid rgba(255,255,255,0.05); }
        h1 { color: var(--primary); font-size: 18px; margin-bottom: 20px; border-bottom: 1px solid #334155; padding-bottom: 10px; }
        .btn { background: #334155; color: white; width: 100%; padding: 15px; margin: 8px 0; border: none; border-radius: 10px; cursor: pointer; text-align: right; font-size: 15px; transition: 0.2s; outline: none; }
        .correct { background: var(--success) !important; }
        .wrong { background: var(--error) !important; }
        #next { background: var(--primary); color: #0f172a; font-weight: bold; display: none; width: 100%; padding: 15px; border-radius: 10px; border: none; margin-top: 20px; cursor: pointer; font-size: 16px; }
        .nav-footer { display: flex; flex-direction: column; gap: 10px; margin-top: 25px; border-top: 1px solid #334155; padding-top: 15px; }
        .back-btn { background: #475569; color: white; text-decoration: none; padding: 12px; border-radius: 8px; font-size: 14px; text-align: center; font-weight: bold; }
        .tg-btn { background: #0088cc; color: white; text-decoration: none; padding: 12px; border-radius: 8px; font-size: 14px; text-align: center; font-weight: bold; }
    </style>
</head>
<body>
    <div class="card" id="box">
        <h1>الفصل الثالث: أنواع الدول</h1>
        <p id="step" style="color:#94a3b8; font-size:12px; margin-bottom:15px;"></p>
        <h2 id="q" style="font-size:17px; margin-bottom:20px; line-height:1.5;"></h2>
        <div id="opts"></div>
        <button id="next" onclick="nextQ()">السؤال التالي ←</button>
        <div class="nav-footer">
            <a href="https://t.me/mohammed1920" class="tg-btn">📢 قناة التليجرام</a>
            <a href="index.html" class="back-btn">🏠 القائمة الرئيسية</a>
        </div>
    </div>

<script>
    const data = [
        {q: "تُقسم الدول من حيث تكوينها الداخلي إلى قسمين أساسيين هما:", opts: ["ديمقراطية وديكتاتورية", "بسيطة (موحدة) ومركبة (اتحادية)", "غنية وفقيرة", "ملكية وجمهورية"], c: 1},
        {q: "الدولة البسيطة هي التي تكون فيها السلطة:", opts: ["موزعة بين الولايات", "كتلة واحدة تمارسها حكومة واحدة", "ضعيفة جداً", "تحت إشراف دولي"], c: 1},
        {q: "تتميز الدولة البسيطة بوحدة الدستور، وهذا يعني:", opts: ["وجود دستور واحد لكل أقاليم الدولة", "إلغاء الدستور", "تعدد الدساتير", "أن الدستور مكتوب باليد"], c: 0},
        {q: "المركزية الإدارية في الدولة الموحدة تعني:", opts: ["توزيع سلطة القرار على المحافظات", "حصر سلطة البت في الأمور بيد العاصمة", "استقلال القضاء", "إلغاء الوزارات"], c: 1},
        {q: "عدم التركيز الإداري يعني منح بعض الموظفين في الأقاليم سلطة:", opts: ["تشريع القوانين", "البت في بعض الأمور دون الرجوع للوزير", "إعلان الحرب", "تغيير الدستور"], c: 1},
        {q: "الدولة المركبة هي التي تتكون من:", opts: ["مدينة واحدة", "اتحاد دولتين أو أكثر لخلق كيان سياسي جديد", "مجموعة أحزاب", "وزارات متعددة"], c: 1},
        {q: "أضعف أنواع الاتحادات هو:", opts: ["الاتحاد الفيدرالي", "الاتحاد الشخصي", "الاتحاد الفعلي", "الدولة الموحدة"], c: 1},
        {q: "في الاتحاد الشخصي، الرابط الوحيد بين الدولتين هو:", opts: ["رئيس الدولة (الملك)", "الدستور الواحد", "الجيش المشترك", "العملة الواحدة"], c: 0},
        {q: "يعتبر الاتحاد الفيدرالي (المركزي) أقوى أنواع الاتحادات لأنه:", opts: ["يلغي سيادة الدول الأعضاء خارجياً ويدمجها في دولة واحدة", "يسمح لكل ولاية بإعلان الحرب", "يعتمد على التجارة فقط", "اتحاد مؤقت"], c: 0},
        {q: "في الاتحاد الفيدرالي، توجد هيئة تشريعية (برلمان) تتكون عادة من:", opts: ["غرفة واحدة", "غرفتين (واحدة للشعب وأخرى للولايات)", "مجلس وزراء فقط", "لجنة عسكرية"], c: 1},
        {q: "الاختلاف الجوهري بين الاتحاد الكونفدرالي والفيدرالي هو أن الأول يستند إلى:", opts: ["دستور", "معاهدة دولية", "قانون مدني", "عقد عمل"], c: 1},
        {q: "في الاتحاد الفيدرالي، يتمتع مواطنو الولايات بـ:", opts: ["جنسيات متعددة", "جنسية واحدة هي جنسية الاتحاد", "جنسية أجنبية", "لا جنسية لهم"], c: 1},
        {q: "عند حدوث نزاع بين ولايتين في اتحاد فيدرالي، يتم الفصل فيه بواسطة:", opts: ["الرئيس مباشرة", "المحكمة الاتحادية العليا", "الجيش", "التحكيم الدولي"], c: 1},
        {q: "الاتحاد الفعلي (الحقيقي) يتميز بظهور:", opts: ["رئيس مشترك ومصالح مشتركة مع بقاء دساتير داخلية", "برلمان عالمي", "ملك لا سلطة له", "اتحاد اقتصادي فقط"], c: 0},
        {q: "في الاتحاد الكونفدرالي، يحق لكل دولة عضو:", opts: ["الانسحاب من الاتحاد", "تغيير عملة الاتحاد", "تعيين رئيس الاتحاد", "إلغاء جنسية جيرانها"], c: 0},
        {q: "اللامركزية السياسية هي سمة أساسية في:", opts: ["الدولة الموحدة", "الاتحاد الفيدرالي", "المركزية المطلقة", "الدولة البسيطة"], c: 1},
        {q: "تعتبر الولايات المتحدة الأمريكية نموذجاً لـ:", opts: ["الدولة الموحدة", "الاتحاد الفيدرالي", "الاتحاد الشخصي", "الاتحاد الكونفدرالي"], c: 1},
        {q: "في الدولة البسيطة، المحافظات أو الأقاليم تعتبر:", opts: ["دوائر إدارية تابعة للمركز", "دولاً مستقلة", "كيانات سيادية", "منظمات دولية"], c: 0},
        {q: "التمثيل الدبلوماسي في الاتحاد الفيدرالي يكون بـ:", opts: ["اسم كل ولاية", "اسم دولة الاتحاد فقط", "اسم الحزب الحاكم", "اسم العاصمة فقط"], c: 1},
        {q: "تنشأ الدولة الفيدرالية عادة بطريقتين، هما:", opts: ["الحرب والصلح", "انضمام دول مستقلة أو تفكك دولة موحدة", "البيع والشراء", "الانتخابات والتعيين"], c: 1},
        {q: "السيادة الخارجية في الاتحاد الفيدرالي تكون لـ:", opts: ["الولايات", "الحكومة الاتحادية (المركزية)", "رؤساء البلديات", "الأمم المتحدة"], c: 1},
        {q: "الدستور الفيدرالي يعتبر:", opts: ["قانوناً عادياً", "القانون الأعلى للدولة (السمو)", "نصيحة غير ملزمة", "مذكرة تفاهم"], c: 1},
        {q: "في الاتحاد الكونفدرالي، الحرب بين الأعضاء تعتبر:", opts: ["حرباً أهلية", "حرباً دولية", "مشاجرة بسيطة", "تدريباً عسكرياً"], c: 1},
        {q: "في الاتحاد الفيدرالي، الحرب بين الولايات تعتبر:", opts: ["حرباً دولية", "حرباً أهلية", "خيانة عظمى", "إجراءً قانونياً"], c: 1},
        {q: "الكونجرس في الاتحاد الكونفدرالي هو مجرد:", opts: ["حكومة قوية", "مؤتمر للدبلوماسيين يمثلون دولهم", "محكمة عسكرية", "نادي رياضي"], c: 1},
        {q: "اللامركزية الإدارية تعني توزيع الوظيفة الإدارية بين:", opts: ["المركز وهيئات محلية مستقلة تحت إشرافه", "الوزير وسكرتيره", "الدولة والقطاع الخاص", "الجيش والشرطة"], c: 0},
        {q: "من عيوب الاتحاد الشخصي أنه:", opts: ["دائم جداً", "ينتهي بمجرد اختلاف شخص الحاكم (اتحاد عرضي)", "قوي عسكرياً", "موحد القوانين"], c: 1},
        {q: "توزيع الصلاحيات في الاتحاد الفيدرالي يتم عبر:", opts: ["الدستور الاتحادي", "قرار من رئيس الجمهورية", "القانون المدني", "الاتفاق الشفهي"], c: 0},
        {q: "تتمتع الولايات في النظام الفيدرالي بـ:", opts: ["استقلال ذاتي في الشؤون الداخلية (تشريع وقضاء داخلي)", "استقلال خارجي", "حق إبرام معاهدات دولية", "حق الانفصال"], c: 0},
        {q: "الدولة الموحدة التي تتبع اللامركزية تظل موحدة لأن:", opts: ["أقاليمها لا تملك سيادة سياسية", "جيشها قوي", "مساحتها صغيرة", "لغتها واحدة"], c: 0},
        {q: "في الاتحاد الفعلي، إذا فُقد العرش في إحدى الدولتين:", opts: ["ينتهي الاتحاد فوراً", "يستمر الاتحاد لأن الروابط أصبحت مؤسساتية", "تندلع الحرب", "تتدخل الأمم المتحدة"], c: 1},
        {q: "تتميز الدولة الفيدرالية بوجود:", opts: ["حكومة واحدة فقط", "ازدواجية في السلطات (اتحادية وولائية)", "رئيسين للدولة", "دستورين اتحاديين"], c: 1},
        {q: "المعيار الأساسي للتمييز بين البسيطة والمركبة هو:", opts: ["عدد السكان", "وحدة أو تعدد مراكز السلطة السياسية", "المناخ", "نوع العملة"], c: 1},
        {q: "الاتحاد الكونفدرالي يسمى أيضاً:", opts: ["الاتحاد الاستقلالي", "الاتحاد المركزي", "الاتحاد الاندماجي", "الاتحاد الشخصي"], c: 0},
        {q: "قرارات الاتحاد الكونفدرالي لا تنفذ إلا إذا:", opts: ["وافق عليها الملك", "صادقت عليها الدول الأعضاء ونفذتها حكوماتها", "صدرت باللغة الإنجليزية", "أمر بها القاضي"], c: 1},
        {q: "في الاتحاد الفيدرالي، يتم تعديل الدستور بـ:", opts: ["إرادة المركز وحده", "موافقة المركز وأغلبية الولايات", "قرار المحكمة فقط", "إرادة ولاية واحدة"], c: 1},
        {q: "العلاقة في الاتحاد الكونفدرالي يحكمها:", opts: ["القانون الدستوري", "القانون الدولي العام", "قانون العقود", "قانون الأسرة"], c: 1},
        {q: "العلاقة في الاتحاد الفيدرالي يحكمها:", opts: ["القانون الدولي", "القانون الدستوري الداخلي", "العرف", "الاتفاقيات الثنائية"], c: 1},
        {q: "تمتلك الولايات الفيدرالية الحق في:", opts: ["وضع دستور خاص بها لا يتعارض مع الدستور الاتحادي", "إصدار عملة", "تمثيل دبلوماسي", "إلغاء الجيش الاتحادي"], c: 0},
        {q: "الوحدة في الدولة الموحدة تشمل:", opts: ["السلطة التشريعية والتنفيذية والقضائية", "التجارة فقط", "الرياضة", "المناخ"], c: 0},
        {q: "في الاتحاد الشخصي، هل تلتزم الدولة (أ) بمعاهدات الدولة (ب)؟", opts: ["نعم دائماً", "لا، كل دولة تظل مستقلة في معاهداتها", "فقط في الحرب", "إذا وافق الملك"], c: 1},
        {q: "تعتبر سويسرا تاريخياً نموذجاً تحول من:", opts: ["فيدرالي إلى موحد", "كونفدرالي إلى فيدرالي", "موحد إلى ملكي", "شخصي إلى فعلي"], c: 1},
        {q: "المحكمة الاتحادية في النظام الفيدرالي تراقب:", opts: ["أسعار السلع", "دستورية القوانين وفض النزاعات بين السلطات", "حركة المرور", "الطقس"], c: 1},
        {q: "اللامركزية الإدارية الإقليمية تقوم على:", opts: ["المحافظات والبلديات", "الوزارات والدوائر", "الشركات الخاصة", "السفارات"], c: 0},
        {q: "الرقابة على الهيئات اللامركزية في الدولة الموحدة تسمى:", opts: ["الرقابة الرئاسية", "الوصاية الإدارية", "الرقابة العسكرية", "السيادة"], c: 1},
        {q: "في الاتحاد الفيدرالي، الإقليم هو:", opts: ["مجموع أقاليم الولايات", "العاصمة فقط", "الأراضي المتنازع عليها", "ملك للرئيس"], c: 0},
        {q: "هل يحق لولاية فيدرالية الانفصال من جانب واحد؟", opts: ["نعم دائماً", "لا، لأن الاتحاد الفيدرالي دائم ومبني على دستور", "فقط في حالة الفقر", "إذا وافق الجيران"], c: 1},
        {q: "السلطة التنفيذية في الاتحاد الفيدرالي تكون:", opts: ["مركزية لكل شؤون الاتحاد السيادية", "موزعة لكل وزير", "ضعيفة الصلاحيات", "تابعة للأمم المتحدة"], c: 0},
        {q: "الفرق بين الاتحاد الفعلي والشخصي هو:", opts: ["عدد الملوك", "ظهور مؤسسات مشتركة (خارجية ودفاع) في الفعلي", "نوع الطعام", "اللغة"], c: 1},
        {q: "تعتبر الدولة الموحدة أكثر الأنظمة:", opts: ["تشتتاً", "انتشاراً في العالم (مثل فرنسا والعراق)", "تعقيداً", "ضعفاً"], c: 1},
        {q: "الاستقلال الإداري في اللامركزية لا يعني:", opts: ["الاستقلال السياسي", "العمل المستقل", "وجود ميزانية", "توظيف الكوادر"], c: 0},
        {q: "مجلس الولايات (مثل مجلس الشيوخ) يضمن:", opts: ["المساواة بين الولايات في تمثيل الاتحاد", "سيطرة الكبار", "إلغاء القوانين", "تقليل المصاريف"], c: 0},
        {q: "تعتمد الدولة الفيدرالية على مبدأ:", opts: ["الاندماج المطلق", "الوحدة في التنوع", "التقسيم العرقي", "الحكم الدكتاتوري"], c: 1},
        {q: "يطلق على اللامركزية المرفقية مسمى:", opts: ["اللامركزية المصلحية (المؤسسات العامة)", "اللامركزية الجغرافية", "الوزارة", "الولاية"], c: 0},
        {q: "في الاتحاد الكونفدرالي، المواطنون يظلون:", opts: ["رعايا لدولهم الأصلية فقط", "مواطنين اتحاديين", "بلا هوية", "أجانب"], c: 0},
        {q: "ينشأ الاتحاد الكونفدرالي لحماية:", opts: ["المصالح المشتركة والأمن دون ذوبان السيادة", "البيئة فقط", "التجارة الإلكترونية", "اللغة"], c: 0},
        {q: "تعتبر الدولة البسيطة 'بسيطة' لأن:", opts: ["قوانينها سهلة", "بنيتها السلطوية غير مركبة (جسم واحد)", "مساحتها صغيرة", "شعبها متواضع"], c: 1},
        {q: "الارتباط في الاتحاد الفيدرالي هو ارتباط:", opts: ["قانوني دستوري عميق", "دبلوماسي سطحي", "تجاري مؤقت", "شخصي بين الملوك"], c: 0},
        {q: "يعد الدستور العراقي لعام 2005 دستور دولة:", opts: ["موحدة بسيطة", "اتحادية (فيدرالية)", "كونفدرالية", "بسيطة لامركزية"], c: 1},
        {q: "الهدف النهائي من دراسة أنواع الدول هو معرفة:", opts: ["كيفية توزيع السلطة والسيادة داخل الكيان", "أسماء الملوك", "عدد المحافظات", "طرق بناء العواصم"], c: 0}
    ];

    let cur = 0, score = 0;
    function load() {
        if(cur >= data.length) return;
        const item = data[cur];
        document.getElementById('q').innerText = item.q;
        document.getElementById('step').innerText = `سؤال ${cur+1} من ${data.length}`;
        const div = document.getElementById('opts'); div.innerHTML = '';
        item.opts.forEach((o, i) => {
            const b = document.createElement('button'); b.className = 'btn'; b.innerText = o;
            b.onclick = () => {
                const btns = document.querySelectorAll('.btn'); btns.forEach(x => x.disabled = true);
                if(i === item.c) { b.classList.add('correct'); score++; } 
                else { b.classList.add('wrong'); btns[item.c].classList.add('correct'); }
                document.getElementById('next').style.display = 'block';
            };
            div.appendChild(b);
        });
    }

    function nextQ() {
        cur++;
        if(cur < data.length) { load(); document.getElementById('next').style.display = 'none'; }
        else { document.getElementById('box').innerHTML = `<h2>اكتمل الفصل الثالث! النتيجة: ${score}/${data.length}</h2><a href="index.html" class="back-btn" style="display:block">العودة للرئيسية</a>`; }
    }
    load();
</script>
</body>
</html>
