<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>الفصل الثالث: أنواع الدول</title>
    <style>
        :root { --primary: #c29d5f; --bg: #0f172a; --card: #1e293b; --text: #f1f5f9; --success: #10b981; --error: #ef4444; }
        body { font-family: sans-serif; background-color: var(--bg); color: var(--text); display: flex; justify-content: center; padding: 20px; margin: 0; }
        .card { background: var(--card); width: 100%; max-width: 500px; padding: 25px; border-radius: 15px; text-align: center; box-shadow: 0 10px 30px rgba(0,0,0,0.5); border: 1px solid rgba(255,255,255,0.05); }
        h1 { color: var(--primary); font-size: 18px; margin-bottom: 20px; border-bottom: 1px solid #334155; padding-bottom: 10px; }
        .btn { background: #334155; color: white; width: 100%; padding: 15px; margin: 8px 0; border: none; border-radius: 10px; cursor: pointer; text-align: right; font-size: 15px; transition: 0.2s; outline: none; }
        .correct { background: var(--success) !important; }
        .wrong { background: var(--error) !important; }
        #next { background: var(--primary); color: #0f172a; font-weight: bold; display: none; width: 100%; padding: 15px; border-radius: 10px; border: none; margin-top: 20px; cursor: pointer; font-size: 16px; }
        .nav-footer { display: flex; flex-direction: column; gap: 10px; margin-top: 25px; border-top: 1px solid #334155; padding-top: 15px; }
        .back-btn { background: #475569; color: white; text-decoration: none; padding: 12px; border-radius: 8px; font-size: 14px; text-align: center; font-weight: bold; }
        .tg-btn { background: #0088cc; color: white; text-decoration: none; padding: 12px; border-radius: 8px; font-size: 14px; text-align: center; font-weight: bold; }
    </style>
</head>
<body>
    <div class="card" id="box">
        <h1>الفصل الثالث: أنواع الدول</h1>
        <p id="step" style="color:#94a3b8; font-size:12px; margin-bottom:15px;"></p>
        <h2 id="q" style="font-size:17px; margin-bottom:20px; line-height:1.5;"></h2>
        <div id="opts"></div>
        <button id="next" onclick="nextQ()">السؤال التالي ←</button>
        <div class="nav-footer">
            <a href="https://t.me/mohammed1920" class="tg-btn">📢 قناة التليجرام</a>
            <a href="index.html" class="back-btn">🏠 القائمة الرئيسية</a>
        </div>
    </div>

<script>
    const data = [
        {q: "الدولة التي تمتاز بوحدة السلطة ووحدة الدستور ووحدة الجماعة تسمى:", opts: ["الدولة المركبة", "الدولة البسيطة (الموحدة)", "الاتحاد الكونفدرالي", "الدولة الفيدرالية"], c: 1},
        {q: "في الدولة البسيطة، تخضع جميع الأقاليم والمواطنين لـ:", opts: ["دساتير متعددة", "سلطة حكومية واحدة ومركز واحد للقرار", "أحكام دولية فقط", "مجالس محلية مستقلة سياسياً"], c: 1},
        {q: "تعتبر فرنسا ومصر من الأمثلة التقليدية على:", opts: ["الدولة البسيطة", "الدولة الاتحادية", "الاتحاد الفعلي", "الاتحاد الشخصي"], c: 0},
        {q: "اللامركزية الإدارية في الدولة البسيطة تعني:", opts: ["تقسيم السيادة", "توزيع الوظائف الإدارية مع التبعية للمركز", "الاستقلال السياسي للأقاليم", "حق الانفصال"], c: 1},
        {q: "تنشأ الدولة المركبة من:", opts: ["اندماج دولتين أو أكثر تحت سلطة مشتركة", "توسع إقليم دولة واحدة", "قرار إداري داخلي", "تعيين حاكم جديد"], c: 0},
        {q: "أضعف أنواع الاتحادات بين الدول وأقلها دواماً هو:", opts: ["الاتحاد الفيدرالي", "الاتحاد الشخصي", "الاتحاد الحقيقي", "الدولة الموحدة"], c: 1},
        {q: "في الاتحاد الشخصي، الرابط الوحيد بين الدولتين هو:", opts: ["الدستور", "رئيس الدولة (العرش)", "البرلمان المشترك", "الجنسية الموحدة"], c: 1},
        {q: "يعتبر اتحاد إنجلترا وهانوفر (1714-1837) مثالاً على:", opts: ["اتحاد حقيقي", "اتحاد شخصي", "اتحاد فيدرالي", "دولة بسيطة"], c: 1},
        {q: "في الاتحاد الشخصي، تعتبر الحرب بين دولتين منه:", opts: ["حرباً أهلية", "حرباً دولية", "مجرد تمرد", "غير جائزة قانوناً"], c: 1},
        {q: "يتميز الاتحاد الفعلي (الحقيقي) بظهور:", opts: ["رئيس مشترك مع وحدة السياسة الخارجية", "برلمان محلي فقط", "عملات متعددة", "انعدام التمثيل الدبلوماسي"], c: 0},
        {q: "في الاتحاد الحقيقي، تفقد الدول الأعضاء:", opts: ["اسمها فقط", "شخصيتها الدولية وتظهر كدولة واحدة عالمياً", "دساتيرها الداخلية", "جنسياتها"], c: 1},
        {q: "الاتحاد الكونفدرالي (التعاهدي) ينشأ بموجب:", opts: ["دستور", "معاهدة دولية", "قرار ملكي", "قانون محلي"], c: 1},
        {q: "الهيئة العليا التي تدير الاتحاد الكونفدرالي تسمى عادة:", opts: ["البرلمان الاتحادي", "الجمعية أو المؤتمر (الدييت)", "مجلس الوزراء", "المحكمة العليا"], c: 1},
        {q: "في الاتحاد الكونفدرالي، يتمتع مواطنو الدول الأعضاء بـ:", opts: ["جنسية اتحادية موحدة", "جنسياتهم الأصلية المستقلة", "حق التصويت في الدول الأخرى", "جنسية مزدوجة إجبارية"], c: 1},
        {q: "حق الانفصال في الاتحاد الكونفدرالي يعتبر:", opts: ["مستحيلاً قانوناً", "حقاً مقرراً للدول الأعضاء", "خيانة عظمى", "يتطلب موافقة المركز"], c: 1},
        {q: "الدولة الفيدرالية (الاتحادية) تنشأ بموجب:", opts: ["معاهدة دولية", "دستور اتحادي", "اتفاق تجاري", "مرسوم رئاسي"], c: 1},
        {q: "في النظام الفيدرالي، يتم توزيع الاختصاصات بين:", opts: ["الوزارات فقط", "الحكومة الاتحادية وحكومات الولايات", "الشركات والدولة", "الجيش والشرطة"], c: 1},
        {q: "تعد الولايات المتحدة الأمريكية وسويسرا من الأمثلة على:", opts: ["الدولة البسيطة", "الدولة الفيدرالية", "الاتحاد الشخصي", "الاتحاد الاستعماري"], c: 1},
        {q: "السيادة في الدولة الفيدرالية تكون لـ:", opts: ["لكل ولاية على حدة", "للدولة الاتحادية (المركز) في المواجهة الدولية", "للأمم المتحدة", "للمحافظين"], c: 1},
        {q: "يوجد في الدولة الفيدرالية برلمان يتكون غالباً من:", opts: ["غرفة واحدة", "غرفتين (واحدة للشعب وأخرى للولايات)", "ثلاث غرف", "مجلس استشاري فقط"], c: 1},
        {q: "المحكمة العليا في الدولة الفيدرالية تختص بـ:", opts: ["قضايا الجنايات فقط", "فض النزاعات بين الولايات أو بينها وبين المركز", "قضايا المرور", "إصدار العملة"], c: 1},
        {q: "يعتبر العراق في دستور 2005 دولة:", opts: ["موحدة بسيطة", "اتحادية فيدرالية", "كونفدرالية", "ملكية"], c: 1},
        {q: "تختلف الفيدرالية عن الكونفدرالية في أن الأولى:", opts: ["تنشأ بدستور وليست معاهدة", "تسمح بالانفصال", "ليس لها رئيس", "تعتمد على اللغة"], c: 0},
        {q: "في الدولة الموحدة، السلطة التشريعية تكون:", opts: ["متعددة", "واحدة (برلمان واحد)", "موزعة على الأقاليم", "غير موجودة"], c: 1},
        {q: "المركزية الإدارية تعني:", opts: ["حصر القرار بيد السلطة المركزية بالعاصمة", "توزيع القرار", "إلغاء الوزارات", "فصل السلطات"], c: 0},
        {q: "في الاتحاد الحقيقي، المعاهدات التي تبرمها الدولة الاتحادية:", opts: ["تلزم جميع الدول الأعضاء", "تلزم العاصمة فقط", "لا قيمة لها", "اختيارية"], c: 0},
        {q: "أهم ركيزة في نشأة الدولة الفيدرالية هي:", opts: ["الرغبة في الاتحاد مع الحفاظ على الاستقلال الذاتي", "القوة العسكرية", "اللغة المشتركة حتماً", "الدين الواحد"], c: 0},
        {q: "في الدولة الفيدرالية، إذا تعارض قانون ولاية مع القانون الاتحادي:", opts: ["يُطبق قانون الولاية", "يُطبق القانون الاتحادي (الأولوية للمركز)", "يُلغى القانونان", "يُعرض على البرلمان الدولي"], c: 1},
        {q: "التمثيل الدبلوماسي في الاتحاد الكونفدرالي يكون لـ:", opts: ["للاتحاد ككل فقط", "لكل دولة عضو حق التمثيل المستقل", "لا يوجد تمثيل", "للدولة الأكبر فقط"], c: 1},
        {q: "تتحول الدولة من بسيطة إلى مركبة عن طريق:", opts: ["التفكك", "الاتحاد والاندماج", "تغيير العلم", "زيادة عدد السكان"], c: 1},
        {q: "في الاتحاد الشخصي، إذا توفي الملك ولم يكن له وارث في إحدى الدولتين:", opts: ["ينتهي الاتحاد فوراً", "يستمر الاتحاد بالقوة", "تندمج الدولتان إجبارياً", "يتم تعيين رئيس وزراء مشترك"], c: 0},
        {q: "يعتبر الاتحاد السوفيتي سابقاً مثالاً للاتحاد:", opts: ["الشخصي", "الفيدرالي", "الكونفدرالي", "البسيط"], c: 1},
        {q: "في النظام الفيدرالي، تمتلك الولايات دستوراً خاصاً بها بشرط:", opts: ["عدم تعارضه مع الدستور الاتحادي", "أن يكون أطول من الدستور الاتحادي", "موافقة الأمم المتحدة", "أن يكون باللغة الإنجليزية"], c: 0},
        {q: "الاختصاصات 'المشتركة' في الفيدرالية هي التي:", opts: ["تمارسها الولايات فقط", "يمارسها المركز والولايات معاً", "لا يمارسها أحد", "تخص التجارة الدولية فقط"], c: 1},
        {q: "تتميز الدولة البسيطة بـ 'وحدة الشخصية الدولية' وهذا يعني:", opts: ["ظهورها ككيان واحد في المحافل الدولية", "تعدد سفرائها", "انعزالها عن العالم", "تبعيتا لدولة أخرى"], c: 0},
        {q: "اللامركزية السياسية هي مرادف لـ:", opts: ["الدولة البسيطة", "الدولة الفيدرالية", "الدكتاتورية", "الحكم المحلي الإداري"], c: 1},
        {q: "في الفيدرالية، تُقسم السيادة إلى:", opts: ["سيادة خارجية للمركز واستقلال داخلي للولايات", "سيادة كاملة لكل ولاية", "لا توجد سيادة", "سيادة للأقاليم المجاورة"], c: 0},
        {q: "الحرب في الاتحاد الكونفدرالي تعتبر حرباً دولية لأن الأعضاء:", opts: ["دول مستقلة ذات سيادة", "أعداء", "لا يحبون بعضهم", "يستخدمون جيوشاً مختلفة"], c: 0},
        {q: "أي من العوامل التالية يعزز نجاح الفيدرالية؟", opts: ["التنوع الثقافي والجغرافي", "الاستبداد", "إلغاء اللغات المحلية", "المركزية الشديدة"], c: 0},
        {q: "في الاتحاد الحقيقي، المواطنون يحملون:", opts: ["جنسيات متعددة", "جنسية واحدة تمثل الاتحاد", "لا يحملون جنسية", "جنسية الدولة الأقوى"], c: 1},
        {q: "تعد كندا مثالاً لدولة:", opts: ["بسيطة", "فيدرالية", "كونفدرالية", "ملكية مستبدة"], c: 1},
        {q: "الفرق الجوهري بين 'الولاية' في الفيدرالية و 'المحافظة' في البسيطة هو:", opts: ["المساحة", "الولاية تملك سلطة تشريعية ودستوراً والمحافظة لا تملك", "الاسم فقط", "عدد السكان"], c: 1},
        {q: "في الكونفدرالية، قرارات الهيئة الاتحادية تتطلب غالباً:", opts: ["الإجماع", "الأغلبية البسيطة", "قرار الرئيس وحده", "موافقة الجيش"], c: 0},
        {q: "الدولة التي تتكون من عدة ولايات وتخضع لدستور واحد وسلطة عليا واحدة هي:", opts: ["الكونفدرالية", "الفيدرالية", "الشخصية", "البسيطة"], c: 1},
        {q: "ينتهي الاتحاد الشخصي بـ:", opts: ["اختلاف شخص الحاكم بين الدولتين", "قرار البرلمان الدولي", "زيادة الضرائب", "وفاة أي مواطن"], c: 0},
        {q: "في الدولة الموحدة، القوانين تطبق على:", opts: ["العاصمة فقط", "كافة أجزاء الدولة بالتساوي", "المدن الكبيرة", "المناطق الحدودية"], c: 1},
        {q: "نظام 'توزيع الاختصاصات' في الفيدرالية يحدده:", opts: ["القانون المدني", "الدستور الاتحادي", "رئيس الولاية", "المعاهدة"], c: 1},
        {q: "في الاتحاد الكونفدرالي، السيادة الخارجية تكون لـ:", opts: ["للاتحاد", "لكل دولة عضو بشكل مستقل", "للبرلمان المشترك", "لا توجد سيادة"], c: 1},
        {q: "أي نظام يوفر حماية أكبر للأقليات الثقافية؟", opts: ["المركزية المطلقة", "النظام الفيدرالي", "الدولة البسيطة الشديدة", "الاستبداد"], c: 1},
        {q: "تعتبر الإمارات العربية المتحدة دولة:", opts: ["بسيطة", "اتحادية فيدرالية", "شخصية", "واقعية"], c: 1},
        {q: "في الاتحاد الفعلي، إذا أبرمت دولة عضواً معاهدة سابقة للاتحاد:", opts: ["تستمر كما هي", "تذوب في التزامات الاتحاد الجديد", "تعتبر لاغية فوراً", "تنتقل للدول المجاورة"], c: 1},
        {q: "يطلق على الدولة الفيدرالية أيضاً اسم:", opts: ["الدولة الموحدة", "الدولة الاتحادية المركزية", "الاتحاد التعاهدي", "الدولة البسيطة"], c: 1},
        {q: "في الفيدرالية، تعديل الدستور الاتحادي يتطلب عادة:", opts: ["موافقة المركز والولايات معاً", "قرار الرئيس وحده", "موافقة أصغر ولاية", "لا يمكن تعديله"], c: 0},
        {q: "نشأة الدولة الفيدرالية بأسلوب 'التفكك' يعني:", opts: ["تحول دولة بسيطة إلى فيدرالية (مثل البرازيل)", "انهيار الدولة", "استقلالها عن مستعمر", "اندماج دولتين"], c: 0},
        {q: "السيادة في الفيدرالية تعتبر:", opts: ["مجزأة وظيفياً", "مطلقة للمركز", "مطلقة للولايات", "وهمية"], c: 0},
        {q: "أهم وثيقة قانونية في الدولة البسيطة هي:", opts: ["العقد", "الدستور الواحد", "المعاهدة", "اللائحة"], c: 1},
        {q: "في الاتحاد الكونفدرالي، العلاقة بين الدول هي علاقة:", opts: ["تبعية", "تنسيق وتعاون بموجب معاهدة", "اندماج كامل", "صراع"], c: 1},
        {q: "تمتاز الدولة الموحدة بـ 'وحدة السلطة القضائية'، وهذا يعني:", opts: ["وجود محاكم مستقلة لكل مدينة", "نظام قضائي واحد يترأسه مركز واحد", "إلغاء القضاء", "تعدد الدساتير"], c: 1},
        {q: "تعتبر سويسرا حالياً (رغم اسمها التاريخي) دولة:", opts: ["كونفدرالية", "فيدرالية", "بسيطة", "شخصية"], c: 1},
        {q: "الهدف النهائي من دراسة أنواع الدول هو فهم:", opts: ["المساحة", "كيفية توزيع السلطة والسيادة داخل الدولة", "عدد السكان", "المناخ"], c: 1}
    ];

    let cur = 0, score = 0;
    function load() {
        if(cur >= data.length) return;
        const item = data[cur];
        document.getElementById('q').innerText = item.q;
        document.getElementById('step').innerText = `سؤال ${cur+1} من ${data.length}`;
        const div = document.getElementById('opts'); div.innerHTML = '';
        item.opts.forEach((o, i) => {
            const b = document.createElement('button'); b.className = 'btn'; b.innerText = o;
            b.onclick = () => {
                const btns = document.querySelectorAll('.btn'); btns.forEach(x => x.disabled = true);
                if(i === item.c) { b.classList.add('correct'); score++; } 
                else { b.classList.add('wrong'); btns[item.c].classList.add('correct'); }
                document.getElementById('next').style.display = 'block';
            };
            div.appendChild(b);
        });
    }

    function nextQ() {
        cur++;
        if(cur < data.length) { load(); document.getElementById('next').style.display = 'none'; }
        else { document.getElementById('box').innerHTML = `<h2>اكتمل الفصل الثالث! النتيجة: ${score}/${data.length}</h2><a href="index.html" class="back-btn" style="display:block">العودة للرئيسية</a>`; }
    }
    load();
</script>
</body>
</html>
