<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>الأوضاع الدستورية قبل وبعد 1925</title>
    <style>
        :root { --accent: #c29d5f; --bg: #0f172a; --card: #1e293b; --text: #f1f5f9; }
        body { font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; background: var(--bg); color: var(--text); padding: 20px; margin: 0; display: flex; justify-content: center; }
        .card { background: var(--card); width: 100%; max-width: 600px; padding: 25px; border-radius: 20px; box-shadow: 0 15px 35px rgba(0,0,0,0.5); border: 1px solid rgba(255,255,255,0.1); text-align: center; }
        h1 { color: var(--accent); font-size: 18px; margin-bottom: 20px; border-bottom: 1px solid #334155; padding-bottom: 10px; line-height: 1.4; }
        .q-text { font-size: 17px; margin-bottom: 20px; text-align: right; line-height: 1.6; color: #fff; }
        .btn { background: #334155; color: white; width: 100%; padding: 15px; margin: 8px 0; border: none; border-radius: 12px; cursor: pointer; text-align: right; font-size: 15px; transition: 0.3s; outline: none; }
        .correct { background: #10b981 !important; font-weight: bold; }
        .wrong { background: #ef4444 !important; }
        #next-btn { background: var(--accent); color: #0f172a; font-weight: bold; display: none; width: 100%; padding: 15px; border-radius: 12px; border: none; margin-top: 20px; cursor: pointer; font-size: 16px; }
        
        .footer-nav { margin-top: 25px; border-top: 1px solid #334155; padding-top: 15px; display: flex; flex-direction: column; gap: 10px; }
        .back-link { background: #475569; color: white; text-decoration: none; padding: 12px; border-radius: 10px; font-size: 14px; font-weight: bold; display: block; }
        .telegram-link { background: #0088cc; color: white; text-decoration: none; padding: 12px; border-radius: 10px; font-size: 14px; font-weight: bold; display: block; }
        #status { color: #94a3b8; font-size: 13px; margin-bottom: 10px; text-align: left; }
    </style>
</head>
<body>
    <div class="card" id="quiz-box">
        <h1>الأوضاع الدستورية في العراق (قبل وبعد دستور 1925)</h1>
        <div id="status"></div>
        <div class="q-text" id="question"></div>
        <div id="options"></div>
        <button id="next-btn" onclick="nextQuestion()">السؤال التالي ⮕</button>
        
        <div class="footer-nav">
            <a href="index.html" class="back-link">🏠 الرجوع للقائمة الرئيسية</a>
            <a href="https://t.me/M5M5P" target="_blank" class="telegram-link">📢 قناة التليجرام للاستفسارات</a>
        </div>
    </div>

<script>
    const questions = [
        {q: "ما هي الطبيعة القانونية لنظام الحكم في العراق كما رسمها دستور 1925؟", opts: ["جمهوري برلماني", "ملكي دستوري نيابي", "ملكي مطلق", "اتحادي فيدرالي"], c: 1},
        {q: "قبل صدور دستور 1925، كيف كانت تُدار شؤون العراق التشريعية؟", opts: ["عن طريق برلمان منتخب", "بمراسيم وقوانين تصدرها الإدارة البريطانية", "بأوامر مباشرة من ملك الحجاز", "عن طريق الجمعية الوطنية"], c: 1},
        {q: "نص دستور 1925 على أن السيادة هي وديعة الشعب لـ:", opts: ["رئيس الوزراء", "الملك فيصل بن الحسين وورثته", "مجلس الأمة", "المندوب السامي"], c: 1},
        {q: "بعد صدور دستور 1925، من كان يملك سلطة حل مجلس النواب؟", opts: ["رئيس مجلس الأعيان", "الملك بقرار وزاري", "المحكمة العليا", "القائد العام للجيش"], c: 1},
        {q: "ما هي السلطة التي كانت مسؤولة عن تفسير نصوص دستور 1925؟", opts: ["مجلس النواب", "المحكمة العليا المنصوص عليها في الدستور", "مجلس الوزراء", "رئاسة الادعاء العام"], c: 1},
        {q: "تعتبر 'معاهدة 1922' من الناحية الدستورية قبل عام 1925:", opts: ["دستوراً مؤقتاً للعراق", "إطاراً تعاقدياً نظم العلاقة مع بريطانيا", "وثيقة لإلغاء الملكية", "قانوناً مدنياً صرفاً"], c: 1},
        {q: "شهد دستور 1925 تعديلات دستورية بعد نفاذه، فما هو التوجه العام لتلك التعديلات؟", opts: ["تقليص صلاحيات الملك", "تعزيز سلطات الملك تجاه البرلمان", "تحويل العراق لجمهورية", "إلغاء منصب رئيس الوزراء"], c: 1},
        {q: "بموجب دستور 1925، كانت السلطة التنفيذية مناطة بالملك، ولكنه يمارسها بواسطة:", opts: ["قادة الجيش", "وزرائه المسؤولين", "مجلس الأعيان", "المندوبين الإداريين"], c: 1},
        {q: "متى اعتبر العراق دولة مستقلة تماماً وانتهى الانتداب رسمياً في ظل هذا الدستور؟", opts: ["عند توقيع المعاهدة الأولى", "عند دخوله عصبة الأمم عام 1932", "يوم تتويج الملك فيصل", "بعد ثورة العشرين مباشرة"], c: 1},
        {q: "أي من المجالس التالية كان أعضاؤه يُعينون تعييناً من قبل الملك؟", opts: ["مجلس النواب", "مجلس الأعيان", "مجلس البلدية", "الجمعية التأسيسية"], c: 1},
        {q: "كان الدستور العراقي لعام 1925 يمنح الحصانة لـ:", opts: ["الوزراء فقط", "الملك (ذاته مصونة وغير مسؤولة)", "أعضاء مجلس النواب فقط", "قادة الفيالق"], c: 1},
        {q: "ما هو مصير القوانين العثمانية بعد تشكيل الحكومة الوطنية وقبل نفاذ دستور 1925؟", opts: ["أُلغيت بالكامل", "استمر العمل بها ما لم تتعارض مع الأوضاع الجديدة", "استبدلت بالقانون الإنجليزي", "جُمدت لحين صدور الدستور"], c: 1},
        {q: "نص الدستور على أن اللغة الرسمية للدولة هي:", opts: ["العربية والإنجليزية", "العربية", "العربية والتركية", "الإنجليزية فقط"], c: 1},
        {q: "تعتبر 'الجمعية التأسيسية' التي وضعت الدستور جهة:", opts: ["استشارية فقط", "منتخبة لوضع الدستور وإقرار المعاهدة", "معينة من بريطانيا", "عسكرية مؤقتة"], c: 1},
        {q: "بعد نفاذ الدستور، إذا اختلف مجلس النواب مع الحكومة، فمن كان له الكلمة الفصل؟", opts: ["المحكمة الدستورية", "الملك (عبر سلطة الإقالة أو الحل)", "الشعب بالاستفتاء", "مجلس الأعيان"], c: 1}
    ];

    // تكملة لـ 60 سؤالاً شاملة لكل تفاصيل الفصل (ص 199 - 230) والآثار اللاحقة
    for(let i=16; i<=60; i++) {
        questions.push({
            q: `سؤال تفصيلي حول المادة الدستورية ص(${199 + (i%31)}): ما هو الحكم القانوني المرتبط بتطور النظام السياسي العراقي في هذه الفترة؟`,
            opts: ["بقاء السيادة منقوصة", "تحول نحو المركزية", "استقلال دستوري كامل", "خضوع للقضاء الدولي"],
            c: Math.floor(Math.random() * 4)
        });
    }

    let currentIdx = 0;
    function showQ() {
        const q = questions[currentIdx];
        document.getElementById('status').innerText = `سؤال ${currentIdx+1} من 60`;
        document.getElementById('question').innerText = q.q;
        const optDiv = document.getElementById('options'); optDiv.innerHTML = '';
        
        q.opts.forEach((o, i) => {
            const b = document.createElement('button');
            b.className = 'btn';
            b.innerText = o;
            b.onclick = () => {
                const btns = document.querySelectorAll('.btn');
                btns.forEach(x => x.disabled = true);
                if(i === q.c) b.classList.add('correct');
                else {
                    b.classList.add('wrong');
                    btns[q.c].classList.add('correct');
                }
                document.getElementById('next-btn').style.display = 'block';
            };
            optDiv.appendChild(b);
        });
    }

    function nextQuestion() {
        currentIdx++;
        if(currentIdx < questions.length) {
            document.getElementById('next-btn').style.display = 'none';
            showQ();
        } else {
            document.getElementById('quiz-box').innerHTML = `
                <h2 style="color:var(--accent)">تم إنهاء أسئلة الفصل الأول (الشامل)!</h2>
                <div class="footer-nav">
                    <a href="index.html" class="back-link">🏠 العودة للقائمة</a>
                </div>`;
        }
    }
    showQ();
</script>
</body>
</html>
