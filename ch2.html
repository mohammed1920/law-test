<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>الفصل الثاني: الدولة وأركانها</title>
    <script src="sounds.js"></script>
    <style>
        :root { --primary: #c29d5f; --bg: #0f172a; --card: #1e293b; --text: #f1f5f9; --success: #10b981; --error: #ef4444; }
        body { font-family: sans-serif; background-color: var(--bg); color: var(--text); display: flex; justify-content: center; padding: 20px; margin: 0; }
        .card { background: var(--card); width: 100%; max-width: 500px; padding: 25px; border-radius: 15px; text-align: center; box-shadow: 0 10px 30px rgba(0,0,0,0.5); border: 1px solid rgba(255,255,255,0.05); }
        h1 { color: var(--primary); font-size: 18px; margin-bottom: 20px; border-bottom: 1px solid #334155; padding-bottom: 10px; }
        .btn { background: #334155; color: white; width: 100%; padding: 15px; margin: 8px 0; border: none; border-radius: 10px; cursor: pointer; text-align: right; font-size: 15px; transition: 0.2s; outline: none; }
        .correct { background: var(--success) !important; }
        .wrong { background: var(--error) !important; }
        #next { background: var(--primary); color: #0f172a; font-weight: bold; display: none; width: 100%; padding: 15px; border-radius: 10px; border: none; margin-top: 20px; cursor: pointer; font-size: 16px; }
        .nav-footer { display: flex; justify-content: space-between; margin-top: 25px; gap: 10px; border-top: 1px solid #334155; padding-top: 15px; }
        .back-btn { background: #475569; color: white; text-decoration: none; padding: 10px; border-radius: 8px; font-size: 12px; flex: 1; text-align: center; }
    </style>
</head>
<body>
    <div class="card" id="box">
        <h1>الفصل الثاني: الدولة وأركانها</h1>
        <p id="step" style="color:#94a3b8; font-size:12px; margin-bottom:15px;"></p>
        <h2 id="q" style="font-size:17px; margin-bottom:20px; line-height:1.5;"></h2>
        <div id="opts"></div>
        <button id="next" onclick="nextQ()">السؤال التالي ←</button>
        <div class="nav-footer">
            <a href="index.html" class="back-btn">🏠 الرئيسية</a>
            <p style="font-size: 10px; color: #64748b;">الموسيقى تبدأ عند أول نقرة</p>
        </div>
    </div>

<script>
    const data = [
        {q: "يتكون ركن 'الشعب' من الأفراد الذين تربطهم بالدولة رابطة:", opts: ["عرقية", "جغرافية", "قانونية وسياسية (الجنسية)", "اقتصادية"], c: 2},
        {q: "ما هو العنصر الذي يميز 'الأمة' عن 'الشعب' في الفكر الدستوري؟", opts: ["رابطة الجنسية", "الاستقرار في إقليم واحد", "الرغبة في العيش المشترك والروابط المعنوية", "الخضوع لسلطة سياسية واحدة"], c: 2},
        {q: "ركن 'الإقليم' في الدولة يشمل:", opts: ["الأرض فقط", "اليابسة والماء والفضاء الجوي فوقهما", "المدن الكبرى فقط", "المناطق الحدودية"], c: 1},
        {q: "المياه الإقليمية للدولة هي جزء من:", opts: ["الإقليم البحري", "المياه الدولية", "إقليم الدول المجاورة", "أعالي البحار"], c: 0},
        {q: "السلطة السياسية في الدولة (السيادة) تتميز بأنها:", opts: ["مؤقتة", "أصلية ودائمة ولا تتجزأ", "استشارية", "تقبل التنازل عنها"], c: 1},
        {q: "وفقاً لنظرية 'سيادة الأمة'، فإن السيادة ملك لـ:", opts: ["الأفراد بصفة شخصية", "كائن معنوي مستقل يسمى الأمة", "الحاكم فقط", "البرلمان"], c: 1},
        {q: "يترتب على نظرية 'سيادة الشعب' أن الانتخاب هو:", opts: ["وظيفة", "حق شخصي لكل فرد", "منحة من الحاكم", "مقتصر على الأغنياء"], c: 1},
        {q: "في ظل 'سيادة الأمة'، يعتبر النائب ممثلاً لـ:", opts: ["دائرته الانتخابية فقط", "الأمة بأكملها", "حزبه السياسي", "الحكومة"], c: 1},
        {q: "الشخصية المعنوية للدولة تعني:", opts: ["تغير حقوق الدولة بتغير رئيسها", "انفصال أموال الدولة عن أموال الحكام", "عدم إمكانية مقاضاة الدولة", "زوال الديون بموت الحاكم"], c: 1},
        {q: "الاعتراف 'المنشئ' يرى أن الدولة:", opts: ["توجد قبل الاعتراف", "لا توجد قانوناً إلا بعد اعتراف الدول بها", "تنشأ بالقوة فقط", "لا تحتاج لاعتراف"], c: 1},
        {q: "يقصد بـ 'البحر الإقليمي' مسافة من المياه تقدرها الاتفاقيات بـ:", opts: ["100 ميل", "12 ميلاً بحرياً في الغالب", "كل المحيط", "ميل واحد فقط"], c: 1},
        {q: "السيادة 'الداخلية' تعني سلطة الدولة في:", opts: ["إبرام المعاهدات", "فرض سلطانها على إقليمها ومواطنيها", "التمثيل الدبلوماسي", "إعلان الحرب"], c: 1},
        {q: "وفقاً لنظرية سيادة الشعب، تكون السيادة:", opts: ["واحدة لا تتجزأ", "مجزأة بين الأفراد", "ملك للحاكم", "للنخبة"], c: 1},
        {q: "الاعتراف 'الكاشف' يرى أن الاعتراف هو:", opts: ["يخلق الدولة", "مجرد إقرار بواقع موجود مسبقاً", "شرط لنشأة الشعب", "غير قانوني"], c: 1},
        {q: "استمرار الدولة يعني بقاء التزاماتها الدولية:", opts: ["حتى لو تغير نظام الحكم", "بشرط موافقة الرئيس الجديد", "لمدة محددة", "داخل إقليمها فقط"], c: 0},
        {q: "ركن 'الإقليم' يوفر للدولة النطاق المكاني لـ:", opts: ["التجارة فقط", "ممارسة سيادتها", "توزيع المساعدات", "الزراعة"], c: 1},
        {q: "الفرق بين الشعب و 'السكان' هو أن الأخير يشمل:", opts: ["المواطنين فقط", "المواطنين والأجانب المقيمين", "الجيش", "الطلاب"], c: 1},
        {q: "نظرية 'سيادة الأمة' تميل إلى نظام الانتخاب:", opts: ["العام", "المقيد", "السري فقط", "الإلكتروني"], c: 1},
        {q: "في نظرية سيادة الشعب، يعتبر القانون تعبيراً عن:", opts: ["إرادة الأمة المجردة", "إرادة الأغلبية من الأفراد", "رغبة القضاة", "الأعراف"], c: 1},
        {q: "الاعتراف 'القانوني' بالدولة هو اعتراف:", opts: ["مؤقت", "كامل ونهائي", "شفهي", "مشروط"], c: 1},
        {q: "السيادة 'لا تقبل التقادم' تعني أنها:", opts: ["تنتهي بالزمن", "لا تضيع بعدم ممارستها مهما طال الزمن", "دائمية للحاكم", "تخضع للقانون المدني"], c: 1},
        {q: "عنصر 'الاستقرار' في الإقليم يشترط فيه:", opts: ["الإقامة المؤقتة", "العيش الدائم على الأرض", "امتلاك عقارات", "عدم السفر"], c: 1},
        {q: "حق 'مقاومة الظلم' يظهر بوضوح في ظل نظرية:", opts: ["سيادة الأمة", "سيادة الشعب", "الحق الإلهي", "القوة"], c: 1},
        {q: "الدولة 'صاحبة الاختصاص بالاختصاص' هي عبارة تعبر عن:", opts: ["ركن الشعب", "السيادة", "الإقليم المائي", "الاعتراف"], c: 1},
        {q: "الحدود 'الاصطناعية' للإقليم هي التي تضعها:", opts: ["الجبال", "الإنسان (كالأسلاك أو الخطوط الوهمية)", "البحار", "الأنهار"], c: 1},
        {q: "ركن 'السلطة السياسية' يتطلب وجود هيئة:", opts: ["تمارس التجارة", "تملك حق الإكراه المادي والقانوني", "تطوعية", "دينية"], c: 1},
        {q: "الجنسية هي الرابطة التي تحدد:", opts: ["الثراء", "عناصر ركن الشعب", "اللغة", "المذهب"], c: 1},
        {q: "السيادة الخارجية للدولة تعني:", opts: ["السيطرة على المدن", "استقلالها عن أي سلطة خارجية", "التبعية للأمم المتحدة", "تلقي الأوامر"], c: 1},
        {q: "أي نظرية تؤدي إلى 'الاقتراع العام'؟", opts: ["سيادة الأمة", "سيادة الشعب", "الثيوقراطية", "الماركسية"], c: 1},
        {q: "الاعتراف 'الواقعي' يتميز بأنه:", opts: ["نهائي", "مؤقت وقابل للسحب", "شامل", "يمنح حصانة مطلقة"], c: 1},
        {q: "الإقليم 'الجوي' للدولة يمتد إلى:", opts: ["القمر", "الفضاء الخارجي المفتوح", "ما تسمح به القدرة الفنية للدولة على السيطرة", "السحب فقط"], c: 2},
        {q: "من نتائج الشخصية المعنوية للدولة:", opts: ["انعدام المسؤولية", "استقلال ذمتها المالية عن ذمة الحكام", "تبعية الموظفين للرئيس شخصياً", "زوال القوانين"], c: 1},
        {q: "وفقاً لـ 'سيادة الأمة'، الانتخاب هو:", opts: ["حق", "وظيفة تؤديها فئة معينة لصالح الأمة", "اختياري", "لا قيمة له"], c: 1},
        {q: "السيادة 'وحدة لا تتجزأ' تعني:", opts: ["توزيعها بين المحافظات", "عدم إمكانية وجود سيادتين في دولة واحدة", "مشاركتها مع دول أخرى", "تعدد الحكام"], c: 1},
        {q: "حق الانتخاب في نظرية سيادة الشعب مكفول لـ:", opts: ["النخبة فقط", "كل فرد يتمتع بصفة المواطنة", "دافعي الضرائب", "الذكور فقط"], c: 1},
        {q: "تعتبر 'السفارات' جزءاً من إقليم الدولة:", opts: ["الجغرافي", "الاعتباري (القانوني)", "المائي", "لا تعتبر جزءاً"], c: 1},
        {q: "عنصر 'الإكراه' في السلطة السياسية يعني:", opts: ["الظلم", "احتكار الدولة لوسائل القوة لتطبيق القانون", "التعذيب", "السجن بدون سبب"], c: 1},
        {q: "الدولة البسيطة هي التي تكون فيها السيادة:", opts: ["موزعة", "موحدة وغير مجزأة", "مشتركة", "مفقودة"], c: 1},
        {q: "الاعتراف الجماعي بالدولة يتم عادة عبر:", opts: ["التجارة", "المنظمات الدولية (كالأمم المتحدة)", "البريد", "الزيارات"], c: 1},
        {q: "تتميز 'الأمة' بأنها فكرة:", opts: ["قانونية", "اجتماعية وتاريخية", "عسكرية", "مؤقتة"], c: 1},
        {q: "ركن 'الشعب' يشترط فيه من حيث العدد:", opts: ["مليون نسمة", "عدد كافٍ لتحقيق الاكتفاء والاستمرار", "ألف شخص", "لا يشترط أي عدد"], c: 1},
        {q: "تنتفي صفة 'الدولة' إذا فقدت أحد أركانها:", opts: ["صح", "خطأ", "فقط إذا فقدت الإقليم", "فقط إذا فقدت الاعتراف"], c: 0},
        {q: "السيادة 'الأصلية' تعني أنها:", opts: ["مستمدة من دولة أخرى", "نابعة من ذات الدولة وغير مشتقة", "تمنحها الكنيسة", "يقررها البرلمان"], c: 1},
        {q: "النائب في نظرية سيادة الشعب يمثل:", opts: ["الأمة ككل", "ناخبيه فقط (وكالة إلزامية)", "الوزارة", "نفسه"], c: 1},
        {q: "ما هو مبرر وجود 'الإقليم'؟", opts: ["الزراعة فقط", "تحديد النطاق المكاني لسيادة الدولة", "الجمال الطبيعي", "بناء المصانع"], c: 1},
        {q: "تعتبر 'الجنسية' رابطة:", opts: ["دينية", "قانونية وسياسية", "عرقية", "لغوية"], c: 1},
        {q: "أي من هذه ليس من أركان الدولة؟", opts: ["الشعب", "الإقليم", "اللغة الواحدة", "السلطة السياسية"], c: 2},
        {q: "السيادة 'الشاملة' تعني خضوع:", opts: ["الرئيس فقط للقانون", "جميع الأفراد والهيئات داخل الدولة لسلطتها", "الدول المجاورة لها", "الأجانب في الخارج"], c: 1},
        {q: "الاعتراف المشروط هو الذي:", opts: ["يتم فوراً", "يعلق على تنفيذ الدولة لالتزامات معينة", "لا يمكن سحبه", "يخص التجارة فقط"], c: 1},
        {q: "وفقاً لحميد حنون، الدولة هي مؤسسة:", opts: ["تجارية", "سياسية وقانونية تهدف للصالح العام", "عسكرية بحتة", "دينية"], c: 1}
    ];

    let cur = 0, score = 0;
    function load() {
        if(cur >= data.length) return;
        const item = data[cur];
        document.getElementById('q').innerText = item.q;
        document.getElementById('step').innerText = `سؤال ${cur+1} من ${data.length}`;
        const div = document.getElementById('opts'); div.innerHTML = '';
        item.opts.forEach((o, i) => {
            const b = document.createElement('button'); b.className = 'btn'; b.innerText = o;
            b.onclick = () => {
                const btns = document.querySelectorAll('.btn'); btns.forEach(x => x.disabled = true);
                if(i === item.c) { 
                    b.classList.add('correct'); score++; 
                    if(typeof playCorrect === 'function') playCorrect();
                } else { 
                    b.classList.add('wrong'); btns[item.c].classList.add('correct'); 
                    if(typeof playWrong === 'function') playWrong();
                }
                document.getElementById('next').style.display = 'block';
            };
            div.appendChild(b);
        });
    }

    function nextQ() {
        cur++;
        if(cur < data.length) { load(); document.getElementById('next').style.display = 'none'; }
        else { 
            document.getElementById('box').innerHTML = `<h2>اكتمل الفصل الثاني! النتيجة: ${score}/${data.length}</h2><button class='btn' onclick="location.href='index.html'">العودة للرئيسية</button>`; 
        }
    }
    load();
</script>
</body>
</html>
