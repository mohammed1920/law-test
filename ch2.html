<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>الفصل الثاني: الدولة وأركانها</title>
    <style>
        :root { --primary: #c29d5f; --bg: #0f172a; --card: #1e293b; --text: #f1f5f9; --success: #10b981; --error: #ef4444; }
        body { font-family: sans-serif; background-color: var(--bg); color: var(--text); display: flex; justify-content: center; padding: 20px; margin: 0; }
        .card { background: var(--card); width: 100%; max-width: 500px; padding: 25px; border-radius: 15px; text-align: center; box-shadow: 0 10px 30px rgba(0,0,0,0.5); border: 1px solid rgba(255,255,255,0.05); }
        h1 { color: var(--primary); font-size: 18px; margin-bottom: 20px; border-bottom: 1px solid #334155; padding-bottom: 10px; }
        .btn { background: #334155; color: white; width: 100%; padding: 15px; margin: 8px 0; border: none; border-radius: 10px; cursor: pointer; text-align: right; font-size: 15px; transition: 0.2s; outline: none; }
        .correct { background: var(--success) !important; }
        .wrong { background: var(--error) !important; }
        #next { background: var(--primary); color: #0f172a; font-weight: bold; display: none; width: 100%; padding: 15px; border-radius: 10px; border: none; margin-top: 20px; cursor: pointer; font-size: 16px; }
        .nav-footer { display: flex; flex-direction: column; gap: 10px; margin-top: 25px; border-top: 1px solid #334155; padding-top: 15px; }
        .back-btn { background: #475569; color: white; text-decoration: none; padding: 12px; border-radius: 8px; font-size: 14px; text-align: center; font-weight: bold; }
        .tg-btn { background: #0088cc; color: white; text-decoration: none; padding: 12px; border-radius: 8px; font-size: 14px; text-align: center; font-weight: bold; }
    </style>
</head>
<body>
    <div class="card" id="box">
        <h1>الفصل الثاني: الدولة وأركانها</h1>
        <p id="step" style="color:#94a3b8; font-size:12px; margin-bottom:15px;"></p>
        <h2 id="q" style="font-size:17px; margin-bottom:20px; line-height:1.5;"></h2>
        <div id="opts"></div>
        <button id="next" onclick="nextQ()">السؤال التالي ←</button>
        <div class="nav-footer">
            <a href="https://t.me/mohammed1920" class="tg-btn">📢 قناة التليجرام</a>
            <a href="index.html" class="back-btn">🏠 القائمة الرئيسية</a>
        </div>
    </div>

<script>
    const data = [
        {q: "الرابطة القانونية والسياسية التي تربط الفرد بالدولة هي:", opts: ["رابطة الدم", "الجنسية", "الإقامة", "المصلحة"], c: 1},
        {q: "يميز الفكر الدستوري بين الشعب والسكّان، حيث أن السكّان يشملون:", opts: ["المواطنين فقط", "المواطنين والأجانب المقيمين", "الناخبين فقط", "المغتربين"], c: 1},
        {q: "الشعب بالمعنى السياسي يقصد به:", opts: ["جميع المواطنين", "الأفراد الذين يحق لهم التصويت والانتخاب", "الموظفون العموميون", "سكان العاصمة"], c: 1},
        {q: "النظرية الألمانية في تكوين الأمة تعتمد على عناصر مادية أهمها:", opts: ["وحدة اللغة والأصل العرقي", "الإرادة المشتركة", "المستقبل الواحد", "الدستور"], c: 0},
        {q: "النظرية الفرنسية ترى أن الأمة تقوم على عنصر معنوي هو:", opts: ["الدين الواحد", "الرغبة في العيش المشترك", "الجغرافيا", "القوة العسكرية"], c: 1},
        {q: "يتكون ركن الإقليم من ثلاثة أجزاء هي:", opts: ["البري والمائي والجوي", "الزراعي والصناعي والتجاري", "المدني والعسكري", "الداخلي والحدودي"], c: 0},
        {q: "المياه الإقليمية هي جزء من الإقليم:", opts: ["الأرضي", "المائي", "الجوي", "الدولي"], c: 1},
        {q: "تعتبر السلطة السياسية ركناً أساسياً لأنها:", opts: ["تجمع الضرائب", "تبني المستشفيات", "تمارس السيادة وتفرض النظام بالقوة الشرعية", "توزع الأراضي"], c: 2},
        {q: "من خصائص السلطة السياسية أنها 'قاهرة'، ويعني ذلك:", opts: ["ظالمة", "تملك حق احتكار الإكراه المادي لفرض القانون", "لا تتغير", "سرية"], c: 1},
        {q: "السيادة الخارجية للدولة تعني:", opts: ["الاستقلال وعدم التبعية لدولة أخرى", "السيطرة على البحار", "عضوية الأمم المتحدة فقط", "تصدير البضائع"], c: 0},
        {q: "السيادة الداخلية تعني:", opts: ["تعدد مراكز القوى", "سمو سلطة الدولة فوق الجميع داخل إقليمها", "حرية التجارة", "عدم وجود قوانين"], c: 1},
        {q: "تتميز السيادة بأنها 'لا تتجزأ'، وهذا يعني:", opts: ["أنها ملك لشخص واحد", "أنها وحدة واحدة لا يمكن تقسيمها", "أنها مؤقتة", "أنها اختيارية"], c: 1},
        {q: "الشخصية المعنوية للدولة تضمن:", opts: ["بقاء التزامات الدولة رغم تغير الحكام", "زيادة ثروة الحاكم", "إلغاء الدستور", "فصل الشعب"], c: 0},
        {q: "الجنسية هي معيار الانتماء لـ:", opts: ["الأمة", "الشعب بالمعنى القانوني", "الإقليم المائي", "الحزب"], c: 1},
        {q: "الحدود الاصطناعية للإقليم هي التي توضع بـ:", opts: ["الجبال", "المعاهدات وخطوط الطول والعرض", "الأنهار", "الغابات"], c: 1},
        {q: "السلطة السياسية 'الأصلية' هي التي:", opts: ["تستمد قوتها من الخارج", "لا تستمد وجودها من سلطة أخرى تعلوها", "تعتمد على التقاليد فقط", "وراثية دائماً"], c: 1},
        {q: "الأمة تختلف عن الشعب في أنها:", opts: ["جماعة بشرية ترتبط بروابط تاريخية ومعنوية", "تسكن في خيام", "تتكون من الأجانب", "لا تحتاج لإقليم"], c: 0},
        {q: "السيادة صفة ملازمة لـ:", opts: ["رئيس الوزراء", "كيان الدولة", "البرلمان وحده", "المحاكم"], c: 1},
        {q: "يشمل الإقليم الجوي:", opts: ["فوق اليابسة فقط", "فوق الإقليم البري والمائي للدولة", "القمر", "الغلاف الجوي"], c: 1},
        {q: "لا يشترط في الشعب عدداً معيناً لقيام الدولة ولكن يشترط:", opts: ["أن يكون كافياً لاستمرار الجماعة", "أن يتجاوز المليون", "أن يكون من عرق واحد", "أن يكون من الشباب"], c: 0},
        {q: "يطلق على الشعب السياسي مسمى:", opts: ["هيئة الناخبين", "هيئة الموظفين", "القوات المسلحة", "المجتمع المدني"], c: 0},
        {q: "الجنسية تربط الفرد بالدولة برابطة:", opts: ["سياسية وقانونية", "عرقية ودينية", "جغرافية ومناخية", "اقتصادية بحتة"], c: 0},
        {q: "الإقليم في الدولة الحديثة يعتبر:", opts: ["حق ملكية للحاكم", "النطاق المكاني لسيادة الدولة", "هبة من الأمم المتحدة", "مكان مؤقت"], c: 1},
        {q: "تتحدد المياه الإقليمية وفقاً لـ:", opts: ["رغبة الصيادين", "قواعد القانون الدولي والمعاهدات", "طول الشاطئ فقط", "عمق البحر"], c: 1},
        {q: "حق المرور البريء في المياه الإقليمية يخص:", opts: ["السفن الحربية فقط", "السفن التجارية الأجنبية", "الطائرات", "الغواصات المستترة"], c: 1},
        {q: "السيادة تتميز بالاستمرارية، وهذا يعني أنها:", opts: ["ترتبط بحياة الملك", "تظل قائمة ما بقيت الدولة", "تتجدد كل سنة", "تختفي في الحروب"], c: 1},
        {q: "السلطة السياسية 'قانونية' تعني أنها:", opts: ["تستند إلى دستور وقوانين منظمة", "تستخدم السجن دائماً", "غير قابلة للنقد", "تكتب باللغة العربية"], c: 0},
        {q: "الاعتراف الكاشف بالدولة يعني أن الدولة:", opts: ["نشأت بمجرد الاعتراف", "كانت موجودة والاعتراف أقر بهذا الوجود", "دولة ضعيفة", "دولة تحت الحماية"], c: 1},
        {q: "من خصائص السيادة أنها 'مطلقة'، أي أنها:", opts: ["لا تتقيد بأي قانون أبداً", "لا يعلوها سلطة أخرى داخل حدودها", "تسمح بالظلم", "ملك للجيش"], c: 1},
        {q: "السيادة في الأنظمة الديمقراطية الحديثة تعود لـ:", opts: ["رئيس الدولة", "الأمة أو الشعب", "رئيس الوزراء", "مجلس القضاء"], c: 1},
        {q: "الشعب الاجتماعي يشمل:", opts: ["الرجال فقط", "جميع من يحمل الجنسية بغض النظر عن الأهلية السياسية", "الناخبين فقط", "الوزراء"], c: 1},
        {q: "عنصر 'الاستقرار' في الإقليم يعني:", opts: ["السكن في الفنادق", "الإقامة الدائمة والثابتة للجماعة", "عدم السفر للخارج", "بقاء الطقس ثابتاً"], c: 1},
        {q: "الحدود الطبيعية هي الحدود التي تستند إلى:", opts: ["الأسلاك الشائكة", "الجبال والبحار والأنهار", "خطوط الطول", "الاتفاقيات الورقية"], c: 1},
        {q: "الفضاء الجوي للدولة يخضع لسيادتها:", opts: ["بشكل محدود جداً", "بشكل كامل فوق إقليمها", "بالاشتراك مع جيرانها", "لا يخضع للسيادة"], c: 1},
        {q: "السلطة السياسية تتميز بـ 'الشمول'، أي أنها:", opts: ["تطبق على فئة معينة", "تطبق على جميع المقيمين داخل الدولة", "تخص الأغنياء فقط", "تخص العاصمة"], c: 1},
        {q: "الفرق بين الأمة والدولة هو أن الدولة تحتاج إلى:", opts: ["لغة واحدة", "سلطة سياسية حاكمة (ركن أساسي)", "تاريخ طويل", "دين واحد"], c: 1},
        {q: "الجنسية المكتسبة هي التي يحصل عليها الفرد عن طريق:", opts: ["الولادة", "التجنس (بشروط قانونية لاحقة)", "الصدفة", "الوراثة"], c: 1},
        {q: "يعد الإقليم ركناً أساسياً لأنه:", opts: ["يوفر الغذاء", "يحدد النطاق الذي تطبق فيه قوانين الدولة", "جميل المنظر", "كبير المساحة"], c: 1},
        {q: "السيادة الخارجية تعني المساواة بين الدول، وهذا مبدأ في:", opts: ["القانون الدستوري الداخلي", "القانون الدولي العام", "قانون العمل", "قانون العقوبات"], c: 1},
        {q: "عدم القابلية للتنازل عن السيادة يعني:", opts: ["أن الحاكم لا يمكنه بيع سيادة الدولة", "أن الشعب لا يحب السيادة", "أنها ملك للأجانب", "أنها مؤقتة"], c: 0},
        {q: "السلطة السياسية 'وحدة واحدة' تعني:", opts: ["وجود رئيس واحد دائماً", "انسجام التصرفات القانونية للدولة ككيان واحد", "إلغاء البرلمان", "دمج القضاء بالشرطة"], c: 1},
        {q: "الاعتراف الدولي المنشئ يرى أن الدولة:", opts: ["توجد قبل الاعتراف", "لا توجد قانوناً إلا بعد اعتراف الدول بها", "دولة غنية", "دولة استعمارية"], c: 1},
        {q: "يعتبر ركن 'السلطة' هو الركن:", opts: ["المادي", "القانوني والتنظيمي", "الجغرافي", "الثقافي"], c: 1},
        {q: "الإقليم البري يشمل:", opts: ["سطح الأرض فقط", "ما فوق سطح الأرض وما في باطنها من ثروات", "الماء فقط", "المزارع فقط"], c: 1},
        {q: "الحدود الفلكية هي حدود تستند إلى:", opts: ["النجوم", "خطوط الطول ودوائر العرض", "الأبراج", "المناخ"], c: 1},
        {q: "تتميز السلطة في الدولة الحديثة بأنها سلطة:", opts: ["شخصية للحاكم", "عامة ومجردة", "سرية", "ضعيفة"], c: 1},
        {q: "الشخصية المعنوية تجعل للدولة:", opts: ["ذمة مالية مستقلة", "اسماً تجارياً", "ديناً رسمياً", "لغة واحدة"], c: 0},
        {q: "السيادة هي أهم خصائص:", opts: ["القبيلة", "الدولة", "الشركة", "الجمعية"], c: 1},
        {q: "في حالة غياب ركن 'الإقليم' تسمى الجماعة:", opts: ["دولة ناقصة", "أمة بلا أرض (مثل الشعب الفلسطيني قبل الاعتراف)", "عصابة", "شركة"], c: 1},
        {q: "السلطة السياسية تستخدم 'القوة الشرعية' لـ:", opts: ["الظلم", "تنفيذ القانون وحماية الأمن", "جمع التبرعات", "إرهاب المواطنين"], c: 1},
        {q: "يشترط في 'السلطة' أن تكون:", opts: ["ظاهرة ومعترف بها ولها طاعة", "خفية", "مؤقتة لساعة واحدة", "خارجية"], c: 0},
        {q: "رابطة الجنسية تظل قائمة حتى لو:", opts: ["سافر المواطن للخارج", "تغير الحاكم", "كلاهما صحيح", "فقد المواطن ماله"], c: 2},
        {q: "الإقليم المائي يشمل المياه الإقليمية والـ:", opts: ["المياه الداخلية (الموانئ والخليج)", "المحيطات البعيدة", "أنهار الدول الأخرى", "لا شيء"], c: 0},
        {q: "السيادة الداخلية تمنع:", opts: ["إصدار القوانين", "تدخل أي قوة أخرى في إصدار قرارات الدولة", "التجارة", "السياحة"], c: 1},
        {q: "الهدف من وجود 'أركان الدولة' هو:", opts: ["التعقيد", "تحديد الكيان القانوني والسياسي للدولة", "زيادة عدد الدول", "إلغاء القبائل"], c: 1}
    ];

    let cur = 0, score = 0;
    function load() {
        if(cur >= data.length) return;
        const item = data[cur];
        document.getElementById('q').innerText = item.q;
        document.getElementById('step').innerText = `سؤال ${cur+1} من ${data.length}`;
        const div = document.getElementById('opts'); div.innerHTML = '';
        item.opts.forEach((o, i) => {
            const b = document.createElement('button'); b.className = 'btn'; b.innerText = o;
            b.onclick = () => {
                const btns = document.querySelectorAll('.btn'); btns.forEach(x => x.disabled = true);
                if(i === item.c) { b.classList.add('correct'); score++; } 
                else { b.classList.add('wrong'); btns[item.c].classList.add('correct'); }
                document.getElementById('next').style.display = 'block';
            };
            div.appendChild(b);
        });
    }

    function nextQ() {
        cur++;
        if(cur < data.length) { load(); document.getElementById('next').style.display = 'none'; }
        else { document.getElementById('box').innerHTML = `<h2>اكتمل الفصل الثاني! النتيجة: ${score}/${data.length}</h2><a href="index.html" class="back-btn" style="display:block">العودة للرئيسية</a>`; }
    }
    load();
</script>
</body>
</html>
